<script>
const DATA={},PRESET=["pi","sqrt2","e","phi"];
async function loadData(s){if(DATA[s])return DATA[s];const el=document.getElementById("data-"+s);
 if(el){DATA[s]=el.textContent.trim();return DATA[s]}
 try{const r=await fetch("data/"+s+".b64");if(!r.ok)throw 0;DATA[s]=(await r.text()).trim();return DATA[s]}
 catch(e){throw new Error("找不到预置数据 data/"+s+".b64：请用 http 方式打开页面，或把该文件拖入页面")}};
const $=id=>document.getElementById(id),PI=Math.PI;
const RAWB={},DIG={};const rawOf=s=>RAWB[s]||(RAWB[s]=Uint8Array.from(atob(DATA[s]),c=>c.charCodeAt(0)));
function digStr(s){if(!DIG[s]){const r=rawOf(s),h=new Array(r.length);for(let i=0;i<r.length;i++)h[i]=(r[i]<16?"0":"")+r[i].toString(16);DIG[s]=BigInt("0x"+h.join(""))+""}return DIG[s]}
const nbitsFor=nd=>Math.ceil((Math.floor(nd*3.3219281)+1)/8)*8;let BC={};
const RN=["","每两位定一个方向，位移 u。","每位控制左/右转 90°，每步 u，易出现自回避与迷宫状结构。","每三位定一个八方向，单位向量长度 u。","前两位定方向，当前位定步长：0→u，1→5u。","每位转 ±137.5°，每步 u。","每位：0 左转 90°，1 右转 90°；步长 = u×当前连续相同位的计数。","十进制数字：把序列还原为十进制，数字 d → 方向 d×36°（十向）。大数据转换较慢。","Langton 型：未访问格按位转向（0 左 1 右）；已访问格反向转（与上次相反），不消耗位。","强制自回避：2 位定首选方向，若已访问则顺时针找下一个空位，被困即停。","有限状态机海龟：3 个状态，转移表（转向/下一状态/步长 1–2）由“种子”决定。","位置反馈：3 位一组，首位为 1 且离原点 >12u 时朝原点方向走，否则按后两位定方向。","六边形：3 位取 0–5 对应 6 个方向（60° 间隔），6/7 跳过。","三维游走投影：3 位取 0–5 对应 ±x/±y/±z，等轴测投影到二维，6/7 跳过。"];
const SRCN={pi:"π",sqrt2:"√2",e:"e",phi:"φ",r17:"1/7（周期）",champ:"Champernowne",rnd:"伪随机",file:"本地文件"};
let FILE=null;
function bitsOf(src,nd,seed,L){seed=seed||20240611;
 if(src=="file")return FILE;
 if(PRESET.includes(src)){const key=src+nd;if(BC.key==key)return BC.b;let h=BigInt(digStr(src).slice(0,nd)).toString(16);if(h.length&1)h="0"+h;const nb=h.length/2,b=new Uint8Array(nb*8);
  for(let i=0;i<nb;i++){const v=parseInt(h.substr(i*2,2),16);for(let j=0;j<8;j++)b[i*8+j]=(v>>j)&1}BC={key,b};return b}
 const n=L||nbitsFor(nd),b=new Uint8Array(n);
 if(src=="r17"){for(let i=0;i<n;i++)b[i]=i%3==2?1:0}
 else if(src=="champ"){let i=0;for(let q=1;i<n;q++){const s=q.toString(2);for(let c=0;c<s.length&&i<n;c++)b[i++]=+s[c]}}
 else{let s=seed;for(let i=0;i<n;i++){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;b[i]=((t^t>>>14)>>>0)<2147483648?0:1}}
 return b}
function digits(b){const nb=b.length>>3,H=[];for(let i=0;i<nb;i++){let v=0;for(let j=0;j<8;j++)v|=b[i*8+j]<<j;H.push((v<16?"0":"")+v.toString(16))}return BigInt("0x"+H.join(""))+"" }
const D4=[[0,-1],[1,0],[0,1],[-1,0]];
function walk0(rule,b,u){const n=b.length,X=[0],Y=[0];let x=0,y=0;
 const P=(dx,dy)=>{x+=dx;y+=dy;X.push(x);Y.push(y)};
 if(rule==1){for(let i=0;i+1<n;i+=2){const d=D4[b[i]*2+b[i+1]];P(d[0]*u,d[1]*u)}}
 else if(rule==2){let d=0;for(let i=0;i<n;i++){d=(d+(b[i]?1:3))&3;P(D4[d][0]*u,D4[d][1]*u)}}
 else if(rule==3){for(let i=0;i+2<n;i+=3){const a=(b[i]*4+b[i+1]*2+b[i+2])*PI/4;P(Math.sin(a)*u,-Math.cos(a)*u)}}
 else if(rule==4){for(let i=2;i<n;i++){const d=D4[b[i-2]*2+b[i-1]],l=b[i]?5*u:u;P(d[0]*l,d[1]*l)}}
 else if(rule==5){let th=0;const al=137.5*PI/180;for(let i=0;i<n;i++){th+=b[i]?-al:al;P(u*Math.cos(th),u*Math.sin(th))}}
 else{let d=0,c=0;for(let i=0;i<n;i++){c=i&&b[i]==b[i-1]?c+1:1;d=(d+(b[i]?1:3))&3;const l=u*c;P(D4[d][0]*l,D4[d][1]*l)}}
 return{X:Float64Array.from(X),Y:Float64Array.from(Y)}}
function walk(rule,b,u,seed){if(rule<=6)return walk0(rule,b,u);
 const n=b.length,X=[0],Y=[0];let x=0,y=0;const info={};const P=(dx,dy)=>{x+=dx;y+=dy;X.push(x);Y.push(y)};
 if(rule==7){for(const c of digits(b)){const a=(+c)*PI/5;P(u*Math.cos(a),u*Math.sin(a))}}
 else if(rule==8){const M=new Map();let d=0,gx=0,gy=0,i=0,st=0;while(i<n&&st<3*n){const k=gx*4194304+gy,t=M.get(k);let turn;if(t===undefined)turn=b[i++]?1:3;else turn=t==1?3:1;M.set(k,turn);d=(d+turn)&3;gx+=D4[d][0];gy+=D4[d][1];P(D4[d][0]*u,D4[d][1]*u);st++}}
 else if(rule==9){const S=new Set([0]);let gx=0,gy=0;info.trap=null;for(let i=0;i+1<n;i+=2){const d=b[i]*2+b[i+1];let ok=false;for(let t=0;t<4;t++){const dd=(d+t)&3,nx=gx+D4[dd][0],ny=gy+D4[dd][1],k=nx*4194304+ny;if(!S.has(k)){S.add(k);gx=nx;gy=ny;P(D4[dd][0]*u,D4[dd][1]*u);ok=true;break}}if(!ok){info.trap=X.length-1;break}}}
 else if(rule==10){let s=(seed||1)*2654435761>>>0;const rn=()=>{s=Math.imul(s^s>>>15,2246822507)+1013904223>>>0;return s/4294967296},T=[];
  for(let q=0;q<3;q++){T.push([]);for(let c=0;c<2;c++)T[q].push([Math.floor(rn()*3),Math.floor(rn()*3),1+Math.floor(rn()*2)])}
  let q=0,d=0;for(let i=0;i<n;i++){const[tn,nq,l]=T[q][b[i]];d=(d+[3,0,1][tn])&3;q=nq;P(D4[d][0]*u*l,D4[d][1]*u*l)}}
 else if(rule==11){for(let i=0;i+2<n;i+=3){let dd;if(b[i]&&Math.hypot(x,y)>12*u)dd=Math.abs(x)>Math.abs(y)?(x>0?3:1):(y>0?0:2);else dd=b[i+1]*2+b[i+2];P(D4[dd][0]*u,D4[dd][1]*u)}}
 else if(rule==12){for(let i=0;i+2<n;i+=3){const k=b[i]*4+b[i+1]*2+b[i+2];if(k>5)continue;const a=k*PI/3;P(u*Math.cos(a),u*Math.sin(a))}}
 else{let A=0,B=0,C=0;const c=Math.cos(PI/6);for(let i=0;i+2<n;i+=3){const k=b[i]*4+b[i+1]*2+b[i+2];if(k>5)continue;const g=k&1?1:-1,ax=k>>1;if(ax==0)A+=g;else if(ax==1)B+=g;else C+=g;X.push((A-B)*c*u);Y.push(((A+B)*.5-C)*u)}}
 return{X:Float64Array.from(X),Y:Float64Array.from(Y),info}}
function inter(a,b,c,d,e,f,g,h){
 const o=(px,py,qx,qy,rx,ry)=>{const v=(qx-px)*(ry-py)-(qy-py)*(rx-px);return Math.abs(v)<1e-6?0:v>0?1:-1};
 const on=(px,py,qx,qy,rx,ry)=>Math.min(px,qx)-1e-9<=rx&&rx<=Math.max(px,qx)+1e-9&&Math.min(py,qy)-1e-9<=ry&&ry<=Math.max(py,qy)+1e-9;
 const o1=o(a,b,c,d,e,f),o2=o(a,b,c,d,g,h),o3=o(e,f,g,h,a,b),o4=o(e,f,g,h,c,d);
 if(o1!=o2&&o3!=o4)return true;
 return(o1==0&&on(a,b,c,d,e,f))||(o2==0&&on(a,b,c,d,g,h))||(o3==0&&on(e,f,g,h,a,b))||(o4==0&&on(e,f,g,h,c,d))}
function crossings(X,Y,u){const M=Math.min(X.length-1,40000),g=6*u,H=new Map();let hit=0;
 for(let i=0;i<M;i++){const ax=X[i],ay=Y[i],bx=X[i+1],by=Y[i+1];
  const x0=Math.floor(Math.min(ax,bx)/g),x1=Math.floor(Math.max(ax,bx)/g),y0=Math.floor(Math.min(ay,by)/g),y1=Math.floor(Math.max(ay,by)/g);let f=false;
  for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){const k=gx*100003+gy;let L=H.get(k);if(!L){L=[];H.set(k,L)}
   if(!f)for(const j of L){if(j<i-1&&inter(ax,ay,bx,by,X[j],Y[j],X[j+1],Y[j+1])){f=true;break}}
   L.push(i)}
  if(f)hit++}
 return{hit,M}}
function slope(p){const n=p.length;if(n<2)return NaN;let sx=0,sy=0,sxx=0,sxy=0;for(const[x,y]of p){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y}return(n*sxy-sx*sy)/(n*sxx-sx*sx)}
function hull(P){P.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(P.length<3)return 0;const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
 const lo=[],up=[];for(const p of P){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
 for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
 const h=lo.slice(0,-1).concat(up.slice(0,-1));let a=0;for(let i=0;i<h.length;i++){const p=h[i],q=h[(i+1)%h.length];a+=p[0]*q[1]-q[0]*p[1]}return Math.abs(a)/2}
function full(w,u,lite){const{X,Y}=w,m=X.length-1,S=new Set(),pts=[],cc=[],K=Math.max(1,m>>5);let rev=0,len=0,home=0,first=0,a=1e18,b=-1e18,c=1e18,d=-1e18,ia=1e18,ib=-1e18,ic=1e18,id=-1e18;
 for(let i=0;i<=m;i++){const x=X[i],y=Y[i];if(x<a)a=x;if(x>b)b=x;if(y<c)c=y;if(y>d)d=y;
  const ix=Math.round(x/u),iy=Math.round(y/u),k=ix*4194304+iy;if(i){len+=Math.hypot(x-X[i-1],y-Y[i-1]);if(k==0){home++;if(!first)first=i}}
  if(S.has(k)){if(i)rev++}else{S.add(k);if(!lite)pts.push([ix,iy]);if(ix<ia)ia=ix;if(ix>ib)ib=ix;if(iy<ic)ic=iy;if(iy>id)id=iy}
  if(!lite&&i&&i%K==0)cc.push([i/m,S.size/i])}
 const cells=(ib-ia+1)*(id-ic+1),bs=Math.max(1,(m/(lite?2e5:1.5e6))|0),bc=[];
