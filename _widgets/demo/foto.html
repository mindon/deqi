<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>&lt;foto-square/&gt; 演示</title><script src="../../_share/imaps.zrv1mafw.js?bootstrap"></script><style>body{padding:1.5rem 2rem 4rem;background:#f6f7f9;color:#222}h1{font-size:1.6rem;margin:0 0 .25rem}.lead{color:#666;margin-bottom:2rem;max-width:60ch}h2{font-size:1.1rem;margin:2rem 0 1rem;padding-bottom:.35rem;border-bottom:1px solid #e2e4e8}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}.card{background:#fff;border:1px solid #e2e4e8;border-radius:10px;padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.6rem;box-shadow:0 1px 2px rgba(0,0,0,.03)}.card h3{margin:0;font-size:.9rem;font-weight:600;color:#444}.card p{margin:0;font-size:.75rem;color:#888;text-align:center}foto-square{--size:240px;--bg:#0c0c0c;--radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12)}.controls{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;background:#fff;border:1px solid #e2e4e8;border-radius:8px;padding:1rem;margin-bottom:1.25rem}.controls label{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;color:#444}.controls button,.controls input,.controls select{padding:.4rem .6rem;border-radius:5px;border:1px solid #cdd0d6;background:#fff;font:inherit}.controls button{cursor:pointer;background:#2c3e50;color:#fff;border-color:#2c3e50}.controls button:hover{background:#1f2d3a}.stage{background:#fff;border:1px solid #e2e4e8;border-radius:10px;padding:1.5rem;display:flex;align-items:center;justify-content:center}.stage foto-square{--size:360px}.note{margin-top:.75rem;font-size:.8rem;color:#6c757d}code{background:#f0f1f4;padding:.05rem .35rem;border-radius:3px;font-size:.85em}#log{margin-top:.75rem;font:0.75rem/1.5 ui-monospace,monospace;color:#555;background:#f0f1f4;border-radius:6px;padding:.6rem .8rem;min-height:1.5rem}</style></head><body><h1>&lt;foto-square/&gt; 组件演示</h1><p class="lead">方形取景框：滚轮 / 双指捏合缩放，拖动平移；缩放与位置按图片文件名记忆于 <code>localStorage</code>，刷新或下次打开自动恢复。</p><h2>1. 交互演示（状态会被记忆）</h2><div class="controls"><label>图片 <select id="pick"><option value="https://picsum.photos/id/1015/1200/800">山川 1015</option><option value="https://picsum.photos/id/1025/900/1200">狗狗 1025（竖图）</option><option value="https://picsum.photos/id/1062/1600/900">海岸 1062（宽图）</option><option value="https://picsum.photos/id/1003/1200/1200">方图 1003</option></select></label> <label>尺寸 <select id="size"><option value="240">240</option><option value="360" selected="selected">360</option><option value="480">480</option></select></label> <button id="reset">重置并清除记忆</button></div><div class="stage"><foto-square id="dyn"></foto-square></div><div id="log">就绪。</div><p class="note">操作后切换图片再切回，或直接刷新页面，可见状态被恢复。</p><h2>2. 多实例（各自独立记忆）</h2><div class="grid"><div class="card"><h3>240px 默认铺满</h3><foto-square src="https://picsum.photos/id/237/800/1000"></foto-square><p><code>src="…/id/237"</code></p></div><div class="card"><h3>限制最大 3x</h3><foto-square src="https://picsum.photos/id/1043/1400/900" max-scale="3"></foto-square><p><code>max-scale="3"</code></p></div><div class="card"><h3>圆角 + 暖色底</h3><foto-square style="--radius:50%;--bg:#2b1d12" src="https://picsum.photos/id/1080/1000/1000"></foto-square><p>头像取景器</p></div></div><script type="module">import"../foto-square.zwz58rj5.js";const dyn=document.getElementById("dyn"),pick=document.getElementById("pick"),size=document.getElementById("size"),reset=document.getElementById("reset"),log=document.getElementById("log");function applyImg(){dyn.setAttribute("src",pick.value)}applyImg(),dyn.style.setProperty("--size",`${size.value}px`),pick.addEventListener("change",applyImg),size.addEventListener("change",()=>{dyn.style.setProperty("--size",`${size.value}px`)}),reset.addEventListener("click",()=>dyn.reset()),dyn.addEventListener("transform-change",e=>{const{name:t,scale:n,x:d,y:s}=e.detail;log.textContent=`已记忆 ${t} → scale=${n.toFixed(3)} x=${d.toFixed(0)} y=${s.toFixed(0)}`})</script></body></html>
