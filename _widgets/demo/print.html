<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>打印排版</title><script src="../../_share/imaps.rendh36z.js?bootstrap"></script><style>*{margin:0;padding:0;box-sizing:border-box}body,html{background:#e9eaee}.toolbar{position:sticky;top:0;z-index:10;background:#2c3e50;color:#fff;padding:.75rem 1rem;display:flex;flex-direction:row;gap:.5rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}.toolbar .row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;font:0.8rem/1.4 system-ui,sans-serif}.toolbar textarea{min-width:40vw;min-height:5rem;resize:vertical;font:0.8rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:.6rem .75rem;border:1px solid #1b2733;border-radius:6px;background:#1b2733;color:#e8eef5}.toolbar label{display:inline-flex;align-items:center;gap:.35rem}.toolbar input[type=number]{width:3.5rem;padding:.2rem .4rem;border-radius:4px;border:none}.toolbar select{padding:.2rem .4rem;border-radius:4px;border:none;font:inherit;background:#1b2733;color:#e8eef5}.toolbar button{padding:.35rem .9rem;border:none;border-radius:5px;background:#4ca1af;color:#fff;cursor:pointer;font:inherit}.toolbar button:hover{background:#3c8a96}.toolbar .hint{color:#9fb3c8}.toolbar .count{margin-left:auto;color:#cfe;font-size:.8rem;margin-bottom:4px;display:flex;align-items:center;gap:.75rem}.toolbar .count .repeat{display:inline-flex;align-items:center;gap:.3rem;cursor:pointer;white-space:nowrap;margin-left:auto}.toolbar .count .repeat input{cursor:pointer}.toolbar .count .fit{display:inline-flex;align-items:center;gap:.3rem;cursor:pointer;white-space:nowrap}.toolbar .count .fit select{padding:.1rem .2rem;border-radius:4px;border:none;font:inherit;background:#1b2733;color:#e8eef5}.toolbar .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;padding:0;border:none;border-radius:4px;background:#1b2733;color:#e8eef5;cursor:pointer}.toolbar .icon-btn:hover{background:#243343}.toolbar .icon-btn.on{background:#2f6f4f;color:#eafff3}.toolbar .icon-btn svg{width:16px;height:16px}.toolbar .icon-btn .ic-lock{display:none}.toolbar .icon-btn .ic-unlock{display:inline}.toolbar .icon-btn.on .ic-lock{display:inline}.toolbar .icon-btn.on .ic-unlock{display:none}#pages{display:flex;flex-direction:column;align-items:center;gap:12mm;padding:12mm 0}.page{--cols:7;--rows:10;--pw:210mm;--ph:297mm;width:var(--pw);height:var(--ph);background:#fff;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);gap:0;overflow:hidden}.page foto-square{display:block;--width:calc(var(--pw) / var(--cols));--height:calc(var(--ph) / var(--rows));--radius:0;--bg:#fff}.empty{padding:4rem 1rem;text-align:center;color:#888;font:0.9rem system-ui,sans-serif}@page{size:A4;margin:0}@media print{body,html{background:#fff}.empty,.toolbar{display:none!important}#pages{gap:0;padding:0}.page{box-shadow:none;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}}.flex{display:flex;align-items:center}.mx-2{margin-left:.25rem}</style><style id="printPageStyle"></style></head><body><div class="toolbar"><div class="row flex"><strong>打印排版</strong><div class="flex"><label>行 <input id="rows" type="number" min="1" max="20" value="10"></label> <label class="mx-2">列 <input id="cols" type="number" min="1" max="20" value="7"></label> <label class="mx-2">页面 <select id="pageSize"><option value="A4">A4</option><option value="A3">A3</option><option value="A5">A5</option><option value="A6">A6</option><option value="Letter">Letter</option><option value="Legal">Legal</option></select></label> <button id="printBtn">打印</button> <button id="exportBtn" class="mx-2" title="导出输入、行列参数与所有图片调整数据到 JSON">导出</button> <button id="importBtn" title="从 JSON 文件恢复输入、参数与调整数据">导入</button> <input id="importFile" type="file" accept="application/json,.json" hidden></div><span class="hint">第一行为 path root，其后每行一个图片路径（支持相对/绝对/URL）；以 <code>---</code> 开头的行作为分页符，其后内容另起新的一页。</span></div><div style="margin-left:auto"><div class="count" id="count"><span id="countText"></span> <label class="fit" title="图片适配方式">适配 <select id="fitSel"><option value="none">none</option><option value="cover">cover</option><option value="contain">contain</option></select></label> <button id="lockedBtn" class="icon-btn" type="button" title="锁定所有图片的缩放与平移" aria-pressed="false"><svg class="ic-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg> <svg class="ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></button> <label class="repeat" title="重复填满整页"><input type="checkbox" id="repeatChk"></label></div><textarea id="src" spellcheck="false"></textarea></div></div><div id="pages"></div><script type="module">import "../foto-square.18z10wm7.js";

    const ta = document.getElementById("src");
    const pagesEl = document.getElementById("pages");
    const countEl = document.getElementById("countText");
    const repeatChk = document.getElementById("repeatChk");
    const fitSel = document.getElementById("fitSel");
    const lockedBtn = document.getElementById("lockedBtn");
    let lockedState = false;
    const colsInp = document.getElementById("cols");
    const rowsInp = document.getElementById("rows");
    const pageSizeSel = document.getElementById("pageSize");
    const printBtn = document.getElementById("printBtn");
    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");

    // ===== 禁止页面缩放（Ctrl/⌘ + 滚轮 / 触摸板捏合 / Ctrl+±=0）=====
    // 桌面浏览器会忽略 viewport 的 user-scalable=no，需主动拦截缩放手势
    window.addEventListener(
      "wheel",
      (e) => {
        if (e.ctrlKey) e.preventDefault(); // Ctrl+滚轮 / 触摸板捏合 = 缩放
      },
      { passive: false },
    );
    window.addEventListener("keydown", (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      const k = e.key;
      // 拦截缩放快捷键：+ - = 0（含小键盘）
      if (k === "+" || k === "-" || k === "=" || k === "_" || k === "0") {
        e.preventDefault();
      }
    });

    // foto-square 组件的 localStorage 键前缀（storagePrefix 默认值）
    const STORE_PREFIX = "foq:";

    // 常见页面尺寸预设（缺省 A4）+ 5 种最常见尺寸
    const PAGE_SIZES = {
      A4: { w: "210mm", h: "297mm" },
      A3: { w: "297mm", h: "420mm" },
      A5: { w: "148mm", h: "210mm" },
      A6: { w: "105mm", h: "148mm" },
      Letter: { w: "215.9mm", h: "279.4mm" },
      Legal: { w: "215.9mm", h: "355.6mm" },
    };
    let curSize = PAGE_SIZES[pageSizeSel.value] || PAGE_SIZES.A4;
    const printPageStyle = document.getElementById("printPageStyle");

    function applyPageSize() {
      curSize = PAGE_SIZES[pageSizeSel.value] || PAGE_SIZES.A4;
      // 动态写入 @page 尺寸，使打印输出匹配所选页面大小
      printPageStyle.textContent =
        `@page { size: ${curSize.w} ${curSize.h}; margin: 0; }`;
    }

    function parse(text) {
      const lines = text.split(/\r?\n/);
      const root = (lines.shift() || "").trim();
      // 以 `---` 开头的行作为分页符：其后内容另起新的一页
      const sections = [[]];
      for (const l of lines) {
        const t = l.trim();
        if (t.startsWith("---")) {
          sections.push([]);
        } else if (t) {
          sections[sections.length - 1].push(t);
        }
      }
      return { root, sections };
    }

    function joinUrl(root, p) {
      // 绝对 URL 或绝对路径：原样使用
      if (/^([a-z][a-z0-9+.-]*:)?\/\//i.test(p) || p.startsWith("/")) {
        return p;
      }
      if (!root) return p;
      return `${root.replace(/\/+$/, "")}/${p.replace(/^\/+/, "")}`;
    }

    function render() {
      const cols = Math.max(1, +colsInp.value || 7);
      const rows = Math.max(1, +rowsInp.value || 10);
      const perPage = cols * rows;
      const { root, sections } = parse(ta.value);

      pagesEl.textContent = "";

      const allPaths = sections.flat();
      if (!allPaths.length) {
        const tip = document.createElement("div");
        tip.className = "empty";
        tip.textContent = "请输入图片路径（首行为 path root）";
        pagesEl.appendChild(tip);
        countEl.textContent = "";
        return;
      }

      // 每个 section 独立成页流；遇 `---` 强制另起新页
      const pages = [];
      for (const section of sections) {
        if (!section.length) continue;
        const spages = [];
        for (let i = 0; i < section.length; i += perPage) {
          spages.push(section.slice(i, i + perPage));
        }
        // 「重复填满整页」：本分段最后一页若未满，用「当前页已放下的内容」循环补齐
        if (repeatChk.checked && spages.length) {
          const last = spages[spages.length - 1];
          if (last.length < perPage) {
            const filled = last.slice();
            while (filled.length < perPage) {
              filled.push(last[filled.length % last.length]);
            }
            spages[spages.length - 1] = filled;
          }
        }
        pages.push(...spages);
      }

      for (const pagePaths of pages) {
        const page = document.createElement("div");
        page.className = "page";
        page.style.setProperty("--cols", cols);
        page.style.setProperty("--rows", rows);
        page.style.setProperty("--pw", curSize.w);
        page.style.setProperty("--ph", curSize.h);
        for (const p of pagePaths) {
          const f = document.createElement("foto-square");
          f.setAttribute("src", joinUrl(root, p));
          f.setAttribute("fit", fitSel.value);
          if (lockedState) f.setAttribute("locked", "");
          const i = p.indexOf("#");
          if (i > 0) {
            f.style.setProperty("--bg", p.substring(i));
          }
          page.appendChild(f);
        }
        pagesEl.appendChild(page);
      }

      const total = pages.reduce((n, pg) => n + pg.length, 0);
      const repeated = total - allPaths.length;
      countEl.textContent =
        `共 ${total} 张${repeated > 0 ? `（含重复 ${repeated}）` : ""}` +
        ` · ${pages.length} 页（每页 ${perPage}）`;
    }

    let timer = 0;
    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(render, 200);
    }

    ta.addEventListener("input", schedule);
    colsInp.addEventListener("change", render);
    rowsInp.addEventListener("change", render);
    pageSizeSel.addEventListener("change", () => {
      applyPageSize();
      render();
    });
    repeatChk.addEventListener("change", render);
    fitSel.addEventListener("change", () => {
      const fit = fitSel.value;
      if (!lockedState && fit !== "none") {
        lockedState = true;
        lockedBtn.classList.toggle("on", true);
      }
      Array.from(pagesEl.querySelectorAll("foto-square")).forEach((f) => {
        f.fit = fit;
        f.locked = lockedState;
      });
    });
    lockedBtn.addEventListener("click", () => {
      lockedState = !lockedState;
      lockedBtn.classList.toggle("on", lockedState);
      Array.from(pagesEl.querySelectorAll("foto-square")).forEach((f) => {
        f.locked = lockedState;
      });
    });
    printBtn.addEventListener("click", () => window.print());

    applyPageSize();

    // 计算某张图片在 localStorage 中的键（与 foto-square 组件一致：SHA-1(pathname) 取前 8 位）
    async function storeKeyFor(src) {
      let name = src;
      try {
        const u = new URL(src, location.href);
        name = u.pathname;
      } catch {
        name = src.split(/[?#]/)[0];
      }
      const msg = new TextEncoder().encode(name);
      const buf = await crypto.subtle.digest("SHA-1", msg);
      const hex = Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
      return `${STORE_PREFIX}${hex.substring(0, 8)}`;
    }

    // ===== 导出：仅收集当前输入所对应图片的调整数据 -> JSON 文件 =====
    async function collectAdjustments() {
      const { root, sections } = parse(ta.value);
      const wanted = new Set();
      for (const section of sections) {
        for (const p of section) wanted.add(await storeKeyFor(joinUrl(root, p)));
      }
      const adjustments = {};
      for (const key of wanted) {
        const raw = localStorage.getItem(key);
        if (raw == null) continue; // 当前输入里没有对应调整则跳过
        try {
          adjustments[key] = JSON.parse(raw);
        } catch {
          adjustments[key] = raw;
        }
      }
      return adjustments;
    }

    async function exportData() {
      const adjustments = await collectAdjustments();
      const payload = {
        version: 1,
        type: "foto-square-print",
        exportedAt: new Date().toISOString(),
        input: ta.value,
        rows: +rowsInp.value || 10,
        cols: +colsInp.value || 7,
        pageSize: pageSizeSel.value,
        fit: fitSel.value,
        locked: !!lockedState,
        repeatFill: !!repeatChk.checked,
        adjustments,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {
        type: "application/json",
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      a.href = url;
      a.download = `foto-print-${stamp}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ===== 导入：从 JSON 文件恢复输入、参数与调整数据 =====
    async function importData(text) {
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        alert("无法解析该 JSON 文件");
        return;
      }
      if (!data || typeof data !== "object") {
        alert("JSON 内容格式不正确");
        return;
      }

      // 合并调整数据：仅写回文件中的键，不清空 localStorage 中已有的其他调整
      if (data.adjustments && typeof data.adjustments === "object") {
        for (const [key, val] of Object.entries(data.adjustments)) {
          if (!key.startsWith(STORE_PREFIX)) continue;
          const str = typeof val === "string" ? val : JSON.stringify(val);
          try {
            localStorage.setItem(key, str);
          } catch {
            /* 配额异常忽略 */
          }
        }
      }

      // 恢复参数与输入
      if (Number.isFinite(+data.rows) && +data.rows > 0) {
        rowsInp.value = +data.rows;
      }
      if (Number.isFinite(+data.cols) && +data.cols > 0) {
        colsInp.value = +data.cols;
      }
      if (data.pageSize && PAGE_SIZES[data.pageSize]) {
        pageSizeSel.value = data.pageSize;
        applyPageSize();
      }
      if (data.fit === "cover" || data.fit === "contain" || data.fit === "none") {
        fitSel.value = data.fit;
      }
      if (typeof data.locked === "boolean") {
        lockedState = data.locked;
        lockedBtn.classList.toggle("on", lockedState);
        lockedBtn.setAttribute("aria-pressed", String(lockedState));
      }
      if (typeof data.input === "string") {
        ta.value = data.input;
      }
      if (typeof data.repeatFill === "boolean") {
        repeatChk.checked = data.repeatFill;
      }

      render();
    }

    exportBtn.addEventListener("click", exportData);
    importBtn.addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", async () => {
      const file = importFile.files && importFile.files[0];
      if (file) importData(await file.text());
      importFile.value = "";
    });

    // const src = "/aby-album/aby-album.json";
    // const src = "/aby-album/picsum.photos.json";
    const src = "/lab/mayday/mayday.json";
    const resp = await fetch(src);
    const text = await resp.text();
    importData(text);
    render();</script></body></html>
