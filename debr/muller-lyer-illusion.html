<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>波动的缪勒-莱尔错觉: ∅M〇ᶻ</title>
<style>
:root{--bg:#050508;--fg:#e6e6ee;--mut:#9a9ab0;--card:#14141c;--bd:#2a2a38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:18px;margin:6px 0 2px}
p.s{margin:0 0 10px;color:var(--mut);font-size:13px;text-align:center;max-width:640px}
canvas{max-width:100%;background:#000;border-radius:8px}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;width:100%;max-width:760px;margin-top:12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
label b{color:var(--fg);font-weight:500;display:flex;justify-content:space-between}
input[type=range]{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;grid-column:1/-1}
button{background:#23233a;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
button:hover{background:#2e2e4a}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg)}
</style>
</head>
<body>
<h1>∅M〇ᶻ：波动的缪勒-莱尔错觉</h1>
<p class="s">所有黄线与紫线长度完全相同。箭头夹角随时间摆动，相邻列有相位差，于是线段看起来在“伸缩”。</p>
<canvas id="c"></canvas>
<div class="panel">
  <label><b>速度 <span id="v1"></span></b><input id="speed" type="range" min="0" max="3" step="0.05" value="0.8"></label>
  <label><b>相位差（列间） <span id="v2"></span></b><input id="delay" type="range" min="0" max="1.2" step="0.01" value="0.38"></label>
  <label><b>摆动幅度 <span id="v3"></span></b><input id="amp" type="range" min="10" max="85" step="1" value="55"></label>
  <label><b>箭头翼长 <span id="v4"></span></b><input id="wing" type="range" min="8" max="40" step="1" value="22"></label>
  <label><b>列数 <span id="v5"></span></b><input id="cols" type="range" min="5" max="31" step="2" value="19"></label>
  <label><b>线宽 <span id="v6"></span></b><input id="lw" type="range" min="1" max="6" step="0.5" value="2.5"></label>
  <div class="row">
    <button id="play">暂停</button>
    <button id="rev">反向</button>
    <button id="reset">重置</button>
    <label class="chk"><input type="checkbox" id="ruler">显示等长标尺</label>
    <label class="chk"><input type="checkbox" id="only">只看线段（隐藏箭头）</label>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const defs={speed:.8,delay:.38,amp:55,wing:22,cols:19,lw:2.5};
const ids=['speed','delay','amp','wing','cols','lw'];
const S={playing:true,dir:1,t:0,offset:0};
const SEG=11;
function vals(){const o={};ids.forEach((k,i)=>{o[k]=+$(k).value;$('v'+(i+1)).textContent=$(k).value});return o}
function size(){
  const w=Math.min(760,document.body.clientWidth-24),v=vals();
  const gap=w/(v.cols+1),seg=gap*2.3,h=seg*SEG+gap*1.6;
  const d=window.devicePixelRatio||1;
  cv.width=w*d;cv.height=h*d;cv.style.width=w+'px';cv.style.height=h+'px';
  ctx.setTransform(d,0,0,d,0,0);
  return{w,h,gap,seg,v};
}
let G=size();
function draw(){
  const {w,h,gap,seg,v}=G;
  ctx.clearRect(0,0,w,h);
  const y0=gap*0.8,wl=v.wing*(gap/40*0.9+0.45);
  const only=$('only').checked,ruler=$('ruler').checked;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let c=0;c<v.cols;c++){
    const x=gap*(c+1);
    const th=(90+v.amp*Math.sin(S.t*2*Math.PI*0.5-(c+S.offset)*v.delay*2*Math.PI/ (v.cols/3)*1))*Math.PI/180;
    // th: 与向上方向的夹角; <90° 翼朝上, >90° 翼朝下
    ctx.lineWidth=v.lw;
    for(let i=0;i<SEG;i++){
      ctx.strokeStyle=i%2?'#e9e24a':'#7b3fd4';
      ctx.beginPath();ctx.moveTo(x,y0+i*seg);ctx.lineTo(x,y0+(i+1)*seg);ctx.stroke();
    }
    if(!only){
      ctx.strokeStyle='#dcdce8';ctx.lineWidth=Math.max(1.5,v.lw*.8);
      for(let n=0;n<=SEG;n++){
        const y=y0+n*seg,a=n%2?th:Math.PI-th;
        const dx=Math.sin(a)*wl,dy=-Math.cos(a)*wl;
        ctx.beginPath();ctx.moveTo(x-dx,y+dy);ctx.lineTo(x,y);ctx.lineTo(x+dx,y+dy);ctx.stroke();
      }
    }
  }
  if(ruler){
    const xl=gap*0.35;
    ctx.lineWidth=1;ctx.font='11px sans-serif';
    for(let i=0;i<SEG;i++){
      const ya=y0+i*seg,yb=ya+seg;
      ctx.strokeStyle=ctx.fillStyle=i%2?'#e9e24a':'#9a63ee';
      ctx.beginPath();ctx.moveTo(xl-5,ya);ctx.lineTo(xl+5,ya);ctx.moveTo(xl-5,yb);ctx.lineTo(xl+5,yb);ctx.moveTo(xl,ya);ctx.lineTo(xl,yb);ctx.stroke();
    }
    ctx.fillStyle='#888';ctx.fillText('等长',2,y0-8);
  }
}
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000;last=now;
  if(S.playing)S.t+=dt*v_speed()*S.dir;
  draw();requestAnimationFrame(loop);
}
function v_speed(){return +$('speed').value}
ids.forEach(k=>$(k).addEventListener('input',()=>{G=size()}));
$('ruler').onchange=$('only').onchange=()=>{};
$('play').onclick=()=>{S.playing=!S.playing;$('play').textContent=S.playing?'暂停':'播放'};
$('rev').onclick=()=>S.dir*=-1;
$('reset').onclick=()=>{ids.forEach(k=>$(k).value=defs[k]);S.t=0;S.offset=0;S.dir=1;G=size()};
// 点击暂停/继续，拖动手动调相位
let drag=null,moved=false;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,t:S.t};moved=false;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4)moved=true;if(moved)S.t=drag.t+dx/200});
cv.addEventListener('pointerup',()=>{if(drag&&!moved){$('play').click()}drag=null});
addEventListener('resize',()=>{G=size()});
requestAnimationFrame(loop);
</script>
</body>
</html>
