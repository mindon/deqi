<!DOCTYPE html><html><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1,user-scalable=yes">
  <title>眼见未必为实</title>
  <style>
    .container {
      max-width: 640px;padding: 0.25rem; margin: 0 auto;
    }
    p {
      text-align: center;
    }
    .stage {
      background: #777;
      width: 100%;
      height: 420px;
      position: relative;
      overflow: hidden;
    }
    .refer {
        background: #777;
        width: 100%;
        position: relative;
        overflow: hidden;
        height: 40px;
        opacity: .5;
    }
    .confused {
      background-image: linear-gradient(to right,#fff 50%,#000 0);
      background-size: 30px 100%;
      background-position: 42.5px 0;
    }
    .block {
      width: 60px;
      height: 35px;
      position: absolute;
      left: 0;
    }
    .refer .block {
        height: 4px;
    }
    .a {
      background-color: #ff9;
      top: 30%;
    }
    .b {
      background-color: #33d;
      bottom: 30%;
    }
    .moving .block {
      animation: move 12s infinite linear;
    }
    @keyframes move {
      to {
        left: 100%;
      }
    }
  </style>

  <h1 style="text-align: center">眼见未必为实</h1>
  <div class="container">
    <p>黄和蓝的色块似乎一前一后交互前行，实际并非如此，试试 <button>切换背景</button> 看看？</p>
    <div class="refer moving">
        <div class="block a"></div>
    </div>
    <div id="stage" class="stage moving confused">
      <div class="block a"></div>
      <div class="block b"></div>
    </div>
    <div class="refer moving">
        <div class="block b"></div>
    </div>
    <p>关键在黄色色块的运动看起来不像是连续的…</p>
  </div>
</body>
<script>
document.querySelector('button').addEventListener('click', function() {
  document.querySelector('#stage').classList.toggle('confused');
});
</script>
</html>
