<!DOCTYPE html><html lang="zh_CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhenakistoScope 費納奇鏡 - 旋圈SP²:sPINsPACE</title>
    <style>
    body {
        font-size: 10pt;
    }
    option {
        font-size: 1rem;
        padding: 4px;
        text-align: center;
    }
    .cover:has(.loading) {
        pointer-events: none;
    }
    .loading {
      position: relative;
      height: 32px;
      margin: auto;
      display: inline-block;
    }
    .loading:after {
      content: " ";
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--loading-color, #0d6efd);
      animation: breathe 3s infinite;
      z-index: 999;
    }
    @keyframes breathe {
      0%, 100% {
        transform: translateX(-50%) scale(1);
        opacity: 1.0;
      }
      50% {
        transform: translateX(-50%) scale(2);
        opacity: 0.2;
      }
    }
    select {
        width: 14.5rem;
    }
    .local {
        margin-top: .5rem;
    }
    .local input {
        display: block;
        width: 14rem;
        margin: .5rem auto;
        line-height: 2rem;
    }
    #myurl {
        text-align: right;
        direction:RTL;
    }
    dialog {
        border-radius: 8px;
        border: 1px solid #ffb43f7d;
        box-shadow: 0 0 16px #000;
        position: relative;
    }
    dialog a {
        position: absolute;
        right: .6rem;
        top: 0;
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: 200;
    }
    dialog a:active {
        color: orange;
    }
    #mynext {
        border: none;
        border-radius: 2rem;
        background: #ffd485;
        color: #000;
        padding: 10px 1rem;
        line-height: 0.8rem;
        cursor: pointer;
    }
    spin-space {
        display: block;
        text-align: center;
    }
    button:disabled {
        opacity: .65;
    }
    button.download {
        display:flex;
        align-items: center;
        cursor: pointer;
    }
    button.download * {
        pointer-events: none;
    }
    button.download > div {
        margin-left: auto;
    }
    button.download > svg {
        margin-left: .5rem;
        margin-right: auto;
    }
    </style>
</head>
<body>
    <spin-space><div class="cover"><div class="loading"></div></div></spin-space>
    <div style="text-align:center;margin-bottom:.5rem"><button id="mynext">支持❝旋圈SP²｜下載動畫<br><small>💰 Donate &amp; Download Ani</small></button></div>
    <div style="text-align:center">
        <select size="3" autofocus=""></select>
        <div class="local">
            <input id="myurl" type="url" placeholder="a phenakistoscope image URL">
            <input id="myfile" type="file" accept="image/*" title="choose a phenakistoscope image file">
        </div>
    </div>
    <dialog id="mypay" closedby="any"><a>×</a><pay-ways cc-data="cc.json?20250825" lucky-data="lucky.json?20250825">
        <button class="download">
            <div>下載❝旋圈SP²動畫<br><small>Download as WebM</small></div>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-bar-down" viewbox="0 0 16 16">
              <path fill-rule="evenodd" d="M1 3.5a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 0 1h-13a.5.5 0 0 1-.5-.5M8 6a.5.5 0 0 1 .5.5v5.793l2.146-2.147a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 .708-.708L7.5 12.293V6.5A.5.5 0 0 1 8 6"></path>
            </svg>
        </button>
    </pay-ways>
    </dialog>
    <script type="module" src="./spin-space.4fc0102b3b84a920dac36adcc133581a.js"></script>
    <script type="module" src="./pay-ways.922e6022a2cbab1a71702a5006a08221.js"></script>
    <script type="module" src="./capture.30ed8ec1f0f0cff4e2ecc75b9a801cc6.js"></script>
    <script type="module">
    const root = "./phenakisto";
    const sampleSrc = "fish_12f.png";
    const sample = `#${btoa([2,12,1,1200,`${root}/${sampleSrc}`].join('\t'))}`;
    const q$ = (selector) => document.querySelector(selector);

    const myqr = new Image();
    myqr.width = 96;
    myqr.height = 96;
    myqr.src = "../atm/atm.svg";

    const lines = (await fetch(`${root}/list.txt`).then(resp => resp.text())).split("\n");
    const mylist = q$("select");
    const fcc = /\d+(f|cc)/i;
    mylist.innerHTML = lines.map(line => !line ? '' : `<option value="${line}" ${sampleSrc == line ? " selected" : ""}>${
      line.replace(/\.[^.]+$/, '').toUpperCase().replace(fcc, (s) => s.toLowerCase())
    }</option>`).join("");
    const myspin = q$("spin-space");
    myspin.addEventListener("spin", ({detail}) => {
      location.hash = !detail || detail == sample.substring(1) ? '' : `#${detail}`;
    });
    myspin.addEventListener("src-change", (evt) => {
      const {detail} = evt;
      if(/^https?:\/\//i.test(detail)) {
        q$('#myurl').value = detail;
      } else {
        const i = detail.lastIndexOf("/");
        if (i > 0 && mylist.value != detail.substring(i+1)) {
          mylist.value = detail.substring(i+1);
        }
      }
    });
    myspin.init(sample);

    mylist.onchange = () => {
      if(mylist.value) {
        myspin.innerHTML = `<img class="cover" src="${root}/${mylist.value}"/>`;
      }
    };

    const myurl = q$('#myurl');
    myurl.addEventListener("focus", (evt) => {
      evt.target.select();
    });
    myurl.addEventListener("input", (evt) => {
      const src = evt.target.value.trim();
      if(/^https?:\/\//i.test(src)) {
        myspin.init(sample, src);
      } else {
        evt.target.focus();
      }
    });
    q$('#myfile').addEventListener('change', (evt) => {
      const fd = evt.target.files[0];
      if(!fd) return;
      myspin.name = fd.name;
      const reader = new FileReader();
      reader.readAsDataURL(fd);
      reader.onload = () => {
        myspin.init([myspin.state, myspin.frames, myspin.clockwise, myspin.duration, reader.result]);
      };
      reader.onerror = (error) => {
        alert(error);
      };
    });

    const mypay = q$('#mypay');
    q$('#mynext').onclick = () => {
      mypay.querySelector("pay-ways").reset();
      mypay.showModal();
    };
    q$('#mypay a').onclick = () => mypay.close();

    q$('#mypay button').onclick = (evt) => {
      const btn = evt.target;
      btn.disabled = true;
      sp2ani(myspin.name.replace(/\.\w+$/, ''), myspin, () => btn.disabled = false, myqr);
    };
    </script>


</body></html>
