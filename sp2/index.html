<!DOCTYPE html><html lang="zh_CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhenakistoScope 費納奇鏡 - 旋圈SP²:sPINsPACE</title><script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.7/require.min.js"></script><script type="module" src="portfolio-ncc5awz6.js"></script><style>body{font-size:10pt}option{font-size:1rem;padding:4px;text-align:center}.cover:has(.loading){pointer-events:none}.loading{position:relative;height:32px;margin:auto;display:inline-block}.loading:after{content:" ";position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background-color:var(--loading-color,#0d6efd);animation:breathe 3s infinite;z-index:999}@keyframes breathe{0%,100%{transform:translateX(-50%) scale(1);opacity:1}50%{transform:translateX(-50%) scale(2);opacity:.2}}select{width:14.5rem}.local{margin-top:.5rem}.local input{display:block;width:14rem;margin:.5rem auto;line-height:2rem}#myurl{text-align:right;direction:RTL}spin-space{display:block;text-align:center}a>svg{display:block}a *{pointer-events:none}.folio a{color:#3880e5}a.disabled{opacity:.2;pointer-events:none}div.folio{display:none}html.portfolio div.folio{display:flex;align-items:start;margin:.5rem 10vw 2rem;width:80vw}html.portfolio .creator{display:none!important}#myfolio{padding:0 1rem}a.prev{margin-right:auto}a.next{margin-left:auto}atm-qr{display:block;width:320px;height:320px}.ucam{display:flex;align-items:center;justify-content:center}a.shot{color:#9cf;margin-right:4px;border:thin solid #9cf;border-radius:50%;padding:6px}a.shot:hover{border-color:#d60;color:#00f}a.shot:active{color:red}</style></head><body><spin-space><div class="cover"><div class="loading"></div></div></spin-space><div class="folio"><a class="prev"><svg xmlns="http://www.w3.org/2000/svg" width="45" height="45" fill="currentColor" class="bi bi-arrow-left-circle" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z"/></svg></a><div id="myfolio"></div><a class="next"><svg xmlns="http://www.w3.org/2000/svg" width="45" height="45" fill="currentColor" class="bi bi-arrow-right-circle" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M4.5 7.5a.5.5 0 0 0 0 1h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5z"/></svg></a></div><div class="ucam" style="margin-bottom:.5rem"><a class="shot"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-camera" viewBox="0 0 16 16"><path d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4z"/><path d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5m0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M3 6.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0"/></svg></a><button id="mynext" class="donate">支持❝旋圈SP²｜下載動畫<br><small>💰 Donate &amp; Download Ani</small></button></div><div style="text-align:center" class="creator"><select size="3" autofocus></select><div class="local"><input id="myurl" type="url" placeholder="a phenakistoscope image URL"> <input id="myfile" type="file" accept="image/*" title="choose a phenakistoscope image file"></div></div><div id="myqr" popover></div><script type="module" src="spin-space-0ter266f.js"></script><script type="module" src="pay-ways-3r0p7zzf.js"></script><script type="module" src="capture-ehtfsbr9.js"></script><script type="module">const root = "./phenakisto";
    const sampleSrc = "fish_12f.png";
    const sample = `#${btoa([2,12,1,1200,`${root}/${sampleSrc}`].join('\t'))}`;
    const q$ = (selector) => document.querySelector(selector);
    const q$$ = (selector) => [].slice.call(document.querySelectorAll(selector));

    const myqr = new Image();
    myqr.width = 96;
    myqr.height = 96;
    myqr.src = "../atm/atm.svg";

    const lines = (await fetch(`${root}/list.txt`).then(resp => resp.text())).split("\n");
    const mylist = q$("select");
    const fcc = /\d+(f|cc)/i;
    mylist.innerHTML = lines.map(line => !line ? '' : `<option value="${line}" ${sampleSrc == line ? " selected" : ""}>${
      line.replace(/\.[^.]+$/, '').toUpperCase().replace(fcc, (s) => s.toLowerCase())
    }</option>`).join("");
    const myspin = q$("spin-space");
    myspin.addEventListener("spin", ({detail}) => {
      if(document.documentElement.classList.contains("portfolio")) return;
      location.hash = !detail || detail == sample.substring(1) ? '' : `#${detail}`;
    });
    myspin.addEventListener("src-change", (evt) => {
      const {detail} = evt;
      if(/^https?:\/\//i.test(detail)) {
        q$('#myurl').value = detail;
      } else {
        const i = detail.lastIndexOf("/");
        if (i > 0 && mylist.value != detail.substring(i+1)) {
          mylist.value = detail.substring(i+1);
        }
      }
    });
    if(!/[?&]portfolio=/.test(location.search) || window.portfolioErr) myspin.init(sample);
    else window.addEventListener("portfolio-error", () => myspin.init(sample));

    mylist.onchange = () => {
      if(mylist.value) {
        myspin.innerHTML = `<img class="cover" src="${root}/${mylist.value}"/>`;
      }
    };

    const myurl = q$('#myurl');
    myurl.addEventListener("focus", (evt) => {
      evt.target.select();
    });
    myurl.addEventListener("input", (evt) => {
      const src = evt.target.value.trim();
      if(/^https?:\/\//i.test(src)) {
        myspin.init(sample, src);
      } else {
        evt.target.focus();
      }
    });

    const creator = location.search.match(/[?&]creator/);
    async function creatorX() {
      return jsload("./creator-at64np6j.js");
    }

    q$('#myfile').addEventListener('change', (evt) => {
      const fd = evt.target.files[0];
      if(!fd) return;
      const reader = new FileReader();
      reader.onerror = (error) => {
        alert(error);
      };
      if (creator) {
        const cb = async () => {
          await creatorX();
          const {framesOf} = window;
          if(!framesOf) return;
          myspin.make(framesOf(reader.result, null, {
            name: fd.name,
            frames: myspin.frames,
            size: Math.max(myspin.size().width, myspin.size().height),
          }), fd.name);
        };
        reader.onload = cb;
        reader.readAsArrayBuffer(fd);
        return;
      }
      myspin.name = fd.name;
      reader.readAsDataURL(fd);
      reader.onload = () => {
        myspin.init([myspin.state, myspin.frames, myspin.clockwise, myspin.duration, reader.result]);
      };
    });

    q$('#mynext').todo = async (btn, fin, isVip) => {
      let ext = btn.dataset.as;
      if(!ext) {
        ext = btn.querySelector('svg') ? 'mp4' : 'webm';
      }
      await sp2ani(`sp2_mindon.dev_${myspin.name.replace(/\.\w+$/, '')}.${ext}`, myspin, fin, myqr, isVip);
    };
    sp2cam.listen([q$('a.shot')], myspin);</script></body></html>
