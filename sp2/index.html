<!DOCTYPE html><html lang="zh_CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhenakistoScope 費納奇鏡 - 旋圈SP²:sPINsPACE</title>
    <style>
    option {
        font-size: 1rem;
        padding: 4px;
        text-align: center;
    }
    .cover:has(.loading) {
        pointer-events: none;
    }
    .loading {
      position: relative;
      height: 32px;
      margin: auto;
      display: inline-block;
    }
    .loading:after {
      content: " ";
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--loading-color, #0d6efd);
      animation: breathe 3s infinite;
      z-index: 999;
    }
    @keyframes breathe {
      0%, 100% {
        transform: translateX(-50%) scale(1);
        opacity: 1.0;
      }
      50% {
        transform: translateX(-50%) scale(2);
        opacity: 0.2;
      }
    }
    select {
        width: 14.5rem;
    }
    .local {
        margin-top: .5rem;
    }
    .local input {
        display: block;
        width: 14rem;
        margin: .5rem auto;
        line-height: 2rem;
    }
    #myurl {
        text-align: right;
        direction:RTL;
    }
    dialog {
        border-radius: 8px;
        border: 1px solid #ffb43f7d;
        box-shadow: 0 0 16px #000;
        position: relative;
    }
    dialog a {
        position: absolute;
        right: .6rem;
        top: 0;
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: 200;
    }
    dialog a:active {
        color: orange;
    }
    #mynext {
        border: none;
        border-radius: 2rem;
        background: #ffd485;
        color: #000;
        padding: 10px 1rem;
        line-height: 0.8rem;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <spin-space><div class="cover"><div class="loading"></div></div></spin-space>
    <div style="text-align:center;margin-bottom:.5rem"><button id="mynext">支持❝旋圈SP²｜下載動畫<br><small>💰 Donate &amp; Download Ani</small></button></div>
    <div style="text-align:center">
        <select size="3" autofocus=""></select>
        <div class="local">
            <input id="myurl" type="url" placeholder="a phenakistoscope image URL">
            <input id="myfile" type="file" accept="image/*" title="choose a phenakistoscope image file">
        </div>
    </div>
    <dialog id="mypay" closedby="any"><a>×</a><pay-ways>
        <button>下載動畫 TODO</button>
    </pay-ways>
    </dialog>
    <script type="module" src="../spin/spin-space.a21ded8e991cf836dee065e15011eb27.js"></script>
    <script type="module" src="../spin/pay-ways.1e321b86f5d206eae03f4476981079a5.js"></script>
    <script type="module">
    const root = "../../spin/phenakisto";
    const sampleSrc = "fish_12cc.png";
    const sample = `#${btoa([2,12,1,1200,`${root}/${sampleSrc}`].join('\t'))}`;
    const q$ = (selector) => document.querySelector(selector);

    const lines = (await fetch(`${root}/list.txt`).then(resp => resp.text())).split("\n");
    const mylist = q$("select");
    const fcc = /\d+(f|cc)/i;
    mylist.innerHTML = lines.map(line => !line ? '' : `<option value="${line}" ${sampleSrc == line ? " selected" : ""}>${
      line.replace(/\.[^.]+$/, '').toUpperCase().replace(fcc, (s) => s.toLowerCase())
    }</option>`).join("");
    const myspin = q$("spin-space");
    myspin.addEventListener("spin", ({detail}) => {
      location.hash = !detail || detail == sample.substring(1) ? '' : `#${detail}`;
    });
    myspin.addEventListener("src-change", (evt) => {
      const {detail} = evt;
      if(/^https?:\/\//i.test(detail)) {
        q$('#myurl').value = detail;
      } else {
        const i = detail.lastIndexOf("/");
        if (i > 0 && mylist.value != detail.substring(i+1)) {
          mylist.value = detail.substring(i+1);
        }
      }
    });
    myspin.init(sample);

    mylist.onchange = () => {
      if(mylist.value) {
        myspin.innerHTML = `<img class="cover" src="${root}/${mylist.value}"/>`;
      }
    };

    const myurl = q$('#myurl');
    myurl.addEventListener("focus", (evt) => {
      evt.target.select();
    });
    myurl.addEventListener("input", (evt) => {
      const src = evt.target.value.trim();
      if(/^https?:\/\//i.test(src)) {
        myspin.init(sample, src);
      } else {
        evt.target.focus();
      }
    });
    q$('#myfile').addEventListener('change', (evt) => {
      const fd = evt.target.files[0];
      if(!fd) return;
      const reader = new FileReader();
      reader.readAsDataURL(fd);
      reader.onload = () => {
        myspin.init([myspin.state, myspin.frames, myspin.clockwise, myspin.duration, reader.result]);
      };
      reader.onerror = (error) => {
        alert(error);
      };
    });

    q$('#mynext').onclick = () => q$('#mypay').showModal();
    q$('#mypay a').onclick = () => q$('#mypay').close();

    q$('#mypay button').onclick = () => alert("this feature is under developing, in a few days")
    </script>
    <!-- https://collection.sciencemuseumgroup.org.uk/objects/co8084521/phenakistoscope-disc-with-handle -->


</body></html>
