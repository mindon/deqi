<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG 辅助线相机</title><style>.camera-container{position:relative;margin:auto}.rounded{display:flex;align-items:center;justify-content:center}#video{display:block;box-sizing:border-box}#overlay-svg{position:absolute;top:0;left:50%;transform:translateX(-50%);height:100%;pointer-events:none;z-index:10}.controls{text-align:center;padding:20px}button{padding:10px 20px;margin:5px;cursor:pointer}</style></head><body><div class="camera-container"><div class="rounded"><video id="video"></video><svg id="overlay-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><g id="guide-lines"><line x1="33.3" y1="0" x2="33.3" y2="100" stroke="white" stroke-width="0.5" stroke-dasharray="2"/><line x1="66.6" y1="0" x2="66.6" y2="100" stroke="white" stroke-width="0.5" stroke-dasharray="2"/><line x1="0" y1="33.3" x2="100" y2="33.3" stroke="white" stroke-width="0.5" stroke-dasharray="2"/><line x1="0" y1="66.6" x2="100" y2="66.6" stroke="white" stroke-width="0.5" stroke-dasharray="2"/></g></svg></div></div><div class="controls"><button onclick='changeGuide("grid")'>三分法</button> <button onclick='changeGuide("circle")'>人像圆环</button> <button onclick='changeGuide("none")'>关闭辅助线</button><br><br><button id="snap" style="background:red;color:#fff;border-radius:50%;width:60px;height:60px;border:none">拍照</button></div><canvas id="canvas" style="display:none"></canvas><div id="result"></div><script>const video=document.getElementById("video"),canvas=document.getElementById("canvas"),guideGroup=document.getElementById("guide-lines");async function initCamera(){try{const e=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:!1});video.srcObject=e,document.fullscreenElement?document.exitFullscreen():video.requestFullscreen().catch(e=>{console.error(`Error attempting to enable full-screen: ${e.message}`)}),video.play()}catch(e){console.error("无法访问摄像头: ",e),alert("请确保已授权摄像头访问权限")}}function closeCamera(){document.fullscreenElement&&document.exitFullscreen();const e=document.querySelector("video"),t=e.srcObject;if(t){t.getTracks().forEach(e=>e.stop()),e.srcObject=null}}function changeGuide(e){let t="";"grid"===e?t='\n                <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="white" stroke-width="0.5" />\n                <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="white" stroke-width="0.5" />\n                <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="white" stroke-width="0.5" />\n                <line x1="0" y1="66.6" x2="100" y2="66.6" stroke="white" stroke-width="0.5" />':"circle"===e&&(t='<circle cx="50" cy="50" r="45" fill="none" stroke="yellow" stroke-width="1" stroke-dasharray="2" />'),guideGroup.innerHTML=t}document.getElementById("snap").addEventListener("click",()=>{initCamera()}),document.getElementById("video").addEventListener("click",()=>{canvas.width=video.videoWidth,canvas.height=video.videoHeight;canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);const e=canvas.toDataURL("image/png"),t=new Image;t.src=e,t.style.width="200px",document.getElementById("result").innerHTML="<h3>预览：</h3>",document.getElementById("result").appendChild(t),closeCamera()})</script></body></html>
