<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1,user-scalable=yes"><title>The Source of Programming Languages - ❞Who/Flippize/∅M〇ᶻ</title><link rel="stylesheet" href="../flip-3922cc4b.css"><style>atm-flip{--fill-size:contain}flip div.lang{font-size:2em}flip div.lang a{color:#fff!important;text-decoration:none!important}flip img.avatar{float:right;margin-left:1rem;border-radius:4px}flip div.dark-bg{background:#00000088;padding:.25rem 1rem;border-radius:4px}flip div.detail{max-height:100%;max-width:100%;overflow:auto;padding:0 2rem;text-align:left}flip div.detail b{margin:0 .25em;color:#00f!important}flip div.detail>div.logo{text-align:center;margin-bottom:1rem}flip div.detail>div.who{align-items:center;justify-content:center}flip div.detail>div.who img{max-width:calc(var(--size)/3)}flip div.subject\[rb\] small{white-space:nowrap}</style><script src="../flip.x716zg9v.js" type="module"></script></head><body><svg class="atm-extra" xmlns="http://www.w3.org/2000/svg" style="display:none"><symbol id="search" width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></symbol><use href="#wiki"></use><use href="#search"></use></svg><div><script type="module">const csebase="http://www.google.com/cse?cx=partner-pub-6997921015773263:4467526896&ie=UTF-8&q=";window.fixCSE=e=>{e.map(e=>{Array.from(e.querySelectorAll("a.cse")).map(e=>{e.target="_blank",e.href=`${csebase}${e.getAttribute("title")||e.innerText.replace(/^\s+|\s+$/g,"")}`}),Array.from(e.querySelectorAll("a.wiki")).map(e=>{e.target="_blank",e.href=`http://en.wikipedia.org/wiki/${e.getAttribute("key")||e.innerText.replace(/^\s+|\s+$/g,"").replace(/\s+/g,"_")}`})})}</script><atm-flip info="on" generator="fixCSE"><template><flip key="lambda-calculus"><img class="contain" src="code/alonzo_church.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Lambda calculus</a>, 1935</div><img class="avatar" src="code/alonzo_church_lc.jpg" width="45" height="45"> <a class="cse" title="Alonzo Church"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Alonzo_Church">Alonzo Church</a> <small>Jun 14, 1903 – Aug 11, 1995</small></div><div info class="an"><b>Alonzo Church</b> (June 14, 1903 – August 11, 1995) was an American mathematician and logician who made major contributions to mathematical logic and the foundations of theoretical computer science. He is best known for the lambda calculus, Church–Turing thesis, Frege–Church ontology, and the Church–Rosser theorem.<p><a class="wiki" key="Lambda_calculus"><b>Lambda calculus</b></a> was introduced by Alonzo Church in the 1930s as part of an investigation into the foundations of mathematics. Lambda calculus, also written as <b>λ-calculus</b>, is a formal system for function definition, function application and recursion. The portion of lambda calculus relevant to computation is now called the untyped lambda calculus. In both typed and untyped versions, ideas from lambda calculus have found application in the fields of logic, recursion theory (computability), and linguistics, and have played an important role in the development of the theory of programming languages (with untyped lambda calculus being the original inspiration for functional programming, in particular Lisp, and typed lambda calculi serving as the foundation for modern type systems).</p></div></flip><flip class="fill-blur" key="turing-machine"><img class="contain" src="code/alan_turing.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Turing machine</a>, 1936</div><img class="avatar" src="code/alan_turing_tm.jpg" width="45" height="45"> <a class="cse" title="Alan Turing"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Alan_Turing">Alan Turing</a> <small>Jun 23, 1912 – Jun 7, 1954</small></div><div info class="an"><b>Alan Mathison Turing</b>, OBE, FRS ( /<span class="IPA">ˈtjʊərɪŋ</span>/ tewr-ing; 23 June 1912 – 7 June 1954), was an English mathematician, logician, cryptanalyst, and computer scientist. He was highly influential in the development of computer science, providing a formalisation of the concepts of "algorithm" and "computation" with the Turing machine, which played a significant role in the creation of the modern computer. Turing is widely considered to be the father of computer science and artificial intelligence.<p>The <a class="wiki" key="Turing_machine"><b>Turing machine</b></a> mathematically models a machine that mechanically operates on a tape. On this tape are symbols which the machine can read and write, one at a time, using a tape head. Operation is fully determined by a finite set of elementary instructions such as "in state 42, if the symbol seen is 0, write a 1; if the symbol seen is 1, shift to the right, and change into state 17; in state 17, if the symbol seen is 0, write a 1 and change to state 6;" etc.</p></div></flip><flip key="plankalkul"><img class="contain" src="code/konrad_zuse.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Plankalkül</a>, 1943</div><img class="avatar" src="code/konrad_zuse_plankalkul.jpg" width="45" height="45"> <a class="cse" title="Konrad Zuse"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Konrad_Zuse">Konrad Zuse</a> <small>Jun 22, 1910 – Dec 18, 1995</small></div><div info class="an"><b>Konrad Zuse</b> (German pronunciation: [<span class="IPA">ˈkɔnʁat ˈtsuːzə</span>]; 1910–1995) was a German civil engineer and computer pioneer. His greatest achievement was the world's first functional program-controlled Turing-complete computer, the Z3, which became operational in May 1941.<p><a class="wiki" key="Plankalk%C3%BCl"><b>Plankalkül</b></a> (German pronunciation: [<span class="IPA">ˈplaːnkalkyːl</span>], "Plan Calculus") is a computer language designed for engineering purposes by Konrad Zuse between 1943 and 1945. It was the first high-level non-von Neumann programming language to be designed for a computer.</p></div></flip><flip key="machine-code"><div class="an detail"><div class="logo"><img src="code/binary_code.svg" height="60"></div><p><a class="wiki" key="Machine_code"><b>Machine code</b></a> or <b>machine language</b> is a system of instructions and data executed directly by a computer's central processing unit. Machine code may be regarded as a primitive (and cumbersome) programming language or as the lowest-level representation of a compiled and/or assembled computer program. Programs in interpreted languages are not represented by machine code, however, their interpreter (which may be seen as a processor executing the higher level program) often is. Machine code is sometimes called <b>native code</b> when referring to platform-dependent parts of language features or libraries. Machine code should not be confused with so called "<b>bytecode</b>", which is executed by an interpreter.</p></div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Machine code</a>, 1950+</div></div></flip><flip class="fill-blur" key="assembly"><div class="an detail"><div class="flex who"><img src="code/kathleen_booth.jpg"><img src="code/andrew_donald_booth.jpg"></div></div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Assembly</a>, 1950+</div><div><img class="avatar" src="code/kathleen_booth_asm.jpg" width="45" height="45"> <a class="cse" title="Kathleen Booth"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Kathleen_Booth">Kathleen Booth</a> <small>Jul 9, 1922 – Sep 29, 2022</small></div><div style="clear:both;margin-top:.25rem"><a class="cse" title="Andrew Donald Booth"><svg width="12" height="12"><use href="#search"></use></svg></a><img class="avatar" src="code/andrew_donald_booth_asm.jpg" width="45" height="45"> <a class="wiki" key="Andrew_Donald_Booth">Andrew Donald Booth</a> <small>Feb 11, 1918 – Nov 29, 2009</small></div></div><div info class="an"><p>An <a class="wiki" key="Assembly_language"><b>assembly language</b></a> is a low-level programming language for computers, microprocessors, microcontrollers, and other programmable devices. It implements a symbolic representation of the machine codes and other constants needed to program a given CPU architecture. This representation is usually defined by the hardware manufacturer, and is based on <b>mnemonics</b> that symbolize processing steps (instructions), processor registers, memory locations, and other language features. An assembly language is thus specific to a certain physical (or virtual) computer architecture.</p><p>Typically a modern assembler creates object code by translating assembly instruction mnemonics into opcodes, and by resolving symbolic names for memory locations and other entities. The use of symbolic references is a key feature of assemblers, saving tedious calculations and manual address updates after program modifications. Most assemblers also include macro facilities for performing textual substitution—e.g., to generate common short sequences of instructions as inline, instead of called subroutines.</p></div></flip><flip key="fortran"><img class="contain" src="code/john_backus.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Fortran</a>, 1953</div><img class="avatar" src="code/john_backus_fortran.jpg" width="45" height="45"> <a class="cse" title="John Backus"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="John_Backus">John Backus</a> <small>Dec 3, 1924 – Mar 17, 2007</small></div><div info class="an"><b>John Warner Backus</b> (December 3, 1924 – March 17, 2007) was an American computer scientist. He directed the team that invented the first widely used high-level programming language (FORTRAN) and was the inventor of the Backus-Naur form (BNF), the almost universally used notation to define formal language syntax. Backus' historic FORTRAN team consisted of programmers Richard Goldberg, Sheldon F. Best, Harlan Herrick, Peter Sheridan, Roy Nutt, Robert Nelson, Irving Ziller, Lois Haibt, and David Sayre. <i>The name FORTRAN derives from The IBM Mathematical <b>For</b>mula <b>Tran</b>slating System</i><p><a class="wiki" key="Fortran"><b>Fortran</b></a> is a general-purpose, procedural, imperative programming language that is especially suited to numeric computation and scientific computing. Originally developed by IBM at their campus in south San Jose, California in the 1950s for scientific and engineering applications, Fortran came to dominate this area of programming early on and has been in continual use for over half a century in computationally intensive areas such as numerical weather prediction, finite element analysis, computational fluid dynamics, computational physics and computational chemistry. It is one of the most popular languages in the area of high-performance computing and is the language used for programs that benchmark and rank the world's fastest supercomputers.</p></div></flip><flip key="flow-matic"><img class="contain" src="code/grace_hopper.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">FLOW-MATIC</a>, 1955</div><img class="avatar" src="code/grace_hopper_b0.jpg" width="45" height="45"> <a class="cse" title="Grace Hopper"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Grace_Hopper">Grace Hopper</a> <small>Dec 9, 1906 – Jan 1, 1992</small></div><div info class="an">Rear Admiral <b>Grace Murray Hopper</b> (December 9, 1906 – January 1, 1992) was an American computer scientist and United States Navy officer. A pioneer in the field, she was one of the first programmers of the Harvard Mark I computer, and developed the first compiler for a computer programming language. She conceptualized the idea of machine-independent programming languages, which led to the development of COBOL, one of the first modern programming languages.<p><a class="wiki" key="FLOW-MATIC"><b>FLOW-MATIC</b></a>, originally known as B-0 (Business Language version 0), was the first English-like data processing language.</p></div></flip><flip class="fill-blur" key="apl"><img class="contain" src="code/ke_iverson.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="APL language">APL</a>, 1957</div><img class="avatar" src="code/ke_iverson_apl.jpg" width="45" height="45"> <a class="cse" title="Kenneth E. Iverson"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Kenneth_E._Iverson">Kenneth E. Iverson</a> <small><nobr>Dec 17, 1920 – Oct 19, 2004</nobr></small></div><div info class="an"><b>Kenneth Eugene Iverson</b> (17 December 1920 - 19 October 2004) was a Canadian computer scientist noted for the development of the APL programming language in 1962. He was honored with the Turing Award in 1979 for his contributions to mathematical notation and programming language theory. The Iverson Award for contributions to APL was named in his honor.<p><a class="wiki" key="APL_(programming_language)"><b>APL</b></a> (named after the book A Programming Language) is an interactive array-oriented language and integrated development environment which is available from a number of commercial and non-commercial vendors and for most computer platforms.[</p></div></flip><flip class="fill-blur" key="algol" style="--blur-size:contain;--blur-amount:16px"><div class="an detail"><div class="logo"><img src="code/logo_ACM.svg" height="60"></div><a class="wiki" key="ALGOL"><b>ALGOL</b></a> (short for <b>ALGO</b>rithmic <b>L</b>anguage) is a family of imperative computer programming languages originally developed in the mid 1950s which greatly influenced many other languages and became the de facto way algorithms were described in textbooks and academic works for almost the next 30 years.</div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="ALGOL language">ALGOL</a>, 1958</div><a class="cse" title="Association for Computing Machinery"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Association_for_Computing_Machinery">Association for Computing Machinery</a></div></flip><flip key="lisp"><img class="contain" src="code/john_mccarthy.jpg"><div class="subject[rb] dark-bg an" style="width:240px"><div class="lang"><a class="cse">LISP</a>, 1958</div><img class="avatar" src="code/john_mccarthy_lisp.jpg" width="45" height="45"> <a class="cse" title="John McCarthy"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="John_McCarthy_(computer_scientist)">John McCarthy</a> <small>Sep 4, 1927 – Oct 24, 2011</small></div><div info class="an"><b>John McCarthy</b> (born September 4, 1927, in Boston, Massachusetts - <b>October 24, 2011</b>), is an American computer scientist and cognitive scientist who received the Turing Award in 1971 for his major contributions to the field of Artificial Intelligence (AI). He was responsible for the coining of the term "Artificial Intelligence" in his 1955 proposal for the 1956 Dartmouth Conference and is the inventor of the Lisp programming language.<p>Lisp (or <a class="wiki" key="LISP"><b>LISP</b></a>) is a family of computer programming languages with a long history and a distinctive, fully parenthesized syntax. Originally specified in 1958, Lisp is the second-oldest high-level programming language in widespread use today; only Fortran is older (by one year). <i>The name LISP derives from "LISt Processing"</i></p></div></flip><flip class="fill-blur" key="simula"><img class="contain" src="code/ole_johan_kristen.jpg"><div class="subject[rb] dark-bg an" style="width:240px"><div class="lang"><a class="cse" title="Simula language">Simula</a>, 1962</div><div><img class="avatar" src="code/ole_johan_dahl_simula.jpg" width="45" height="45"> <a class="cse" title="Ole-Johan Dahl"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Ole-Johan_Dahl">Ole-Johan Dahl</a> <small>Oct 12, 1931 – Jun 29, 2002</small></div><div style="clear:both;margin-top:.25rem"><img class="avatar" src="code/kristen_nygaard_simula.jpg" width="45" height="45"> <a class="cse" title="Kristen Nygaard"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Kristen_Nygaard">Kristen Nygaard</a> <small>Aug 27, 1926 – Aug 10, 2002</small></div></div><div info class="an"><p><a class="wiki" key="Simula"><b>Simula</b></a> is a name for two programming languages, Simula I and Simula 67, developed in the 1960s at the Norwegian Computing Center in Oslo, by Ole-Johan Dahl and Kristen Nygaard. Syntactically, it is a fairly faithful superset of ALGOL 60.</p><p>Simula 67 introduced objects, classes, 2 subclasses, virtual methods, coroutines, discrete event simulation, and features garbage collection.</p><p>Simula is considered the first object-oriented programming language. As its name implies, Simula was designed for doing simulations, and the needs of that domain provided the framework for many of the features of object-oriented languages today.</p></div></flip><flip class="fill-blur" key="pl-i" style="--blur-size:contain;--blur-amount:16px"><div class="an detail"><div class="logo"><img src="code/logo_IBM.svg" height="60"></div><p><a class="wiki" key="PL/I"><b>PL/I</b></a> ("Programming Language One", pronounced "pee-el-one") is a procedural, imperative computer programming language designed for scientific, engineering, business and systems programming applications. It has been used by various academic, commercial and industrial organizations since it was introduced in the 1960s, and is actively used as of 2011.</p></div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="PL/I language">PL/I</a>, 1964</div><a class="cse" title="IBM"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="IBM">IBM</a></div></flip><flip class="fill-blur" key="basic"><div class="detail"><div class="flex who"><img src="code/john_g_kemeny.jpg"><img src="code/thomas_e_kurtz.jpg"></div></div><div class="subject[rb] dark-bg an" style="width:240px"><div class="lang"><a class="cse" title="BASIC language">BASIC</a>, 1964</div><div><a class="cse" title="John G. Kemeny"><svg width="12" height="12"><use href="#search"></use></svg></a><img class="avatar" src="code/john_g_kemeny_basic.jpg" width="45" height="45"> <a class="wiki" key="John_G._Kemeny">John G. Kemeny</a> <small>May 31, 1926 – Dec 26, 1992</small></div><div style="clear:both;margin-top:.25rem"><a class="cse" title="Thomas E. Kurtz"><svg width="12" height="12"><use href="#search"></use></svg></a><img class="avatar" src="code/thomas_e_kurtz_basic.jpg" width="45" height="45"> <a class="wiki" key="Thomas_E._Kurtz">Thomas E. Kurtz</a> <small>Feb 22, 1928 – Nov 12, 2024</small></div></div><div info class="an"><a class="wiki"><b>BASIC</b></a> (an acronym which stands for Beginner's All-purpose Symbolic Instruction Code) is a family of high-level programming languages designed to be easy to use. The original Dartmouth BASIC was designed in 1964 by <a class="wiki" key="John_George_Kemeny">John George Kemeny</a> and <a class="wiki" key="Thomas_Eugene_Kurtz">Thomas Eugene Kurtz</a> at Dartmouth College in New Hampshire, USA to provide computer access to non-science students.<p><b>John George Kemeny</b> (Hungarian: Kemény János György) (May 31, 1926 – December 26, 1992) was a Hungarian American mathematician, computer scientist, and educator best known for co-developing[1] the BASIC programming language in 1964 with Thomas E. Kurtz. Kemeny served as the 13th President of Dartmouth College from 1970 to 1981 and pioneered the use of computers in college education.</p><p><b>Thomas Eugene Kurtz</b> (born February 22, 1928) is an American computer scientist who co-developed the BASIC programming language during 1963 to 1964, together with John G. Kemeny.</p></div></flip><flip class="fill-blur" key="c"><img class="contain" src="code/dennis_ritchie.jpg"><div class="subject[rb] dark-bg an" style="width:220px"><div class="lang"><a class="cse" title="C language">C</a>, 1969</div><img class="avatar" src="code/dennis_ritchie_c.jpg" width="45" height="45"> <a class="cse" title="Dennis Ritchie"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Dennis_Ritchie">Dennis Ritchie</a> <small>Sep 9, 1941 – Oct 12, 2011</small></div><div info class="an">Bell Telephone Laboratories. <b>Dennis MacAlistair Ritchie</b> (username: dmr, born September 9, 1941 - <b>October 8, 2011</b>) is an American computer scientist notable for developing C and for having influence on other programming languages, as well as operating systems such as Multics and Unix.<p><a class="wiki" key="C_language"><b>C</b></a> is a general-purpose computer programming language developed between 1969 and 1973 by Dennis Ritchie at the Bell Telephone Laboratories for use with the Unix operating system. Although C was designed for implementing system software, it is also widely used for developing portable application software.</p></div></flip><flip class="fill-blur" key="pascal"><img class="contain" src="code/niklaus_wirth.jpg"><div class="subject[rb] dark-bg an" style="width:230px"><div class="lang"><a class="cse">Pascal</a>, 1970</div><img class="avatar" src="code/niklaus_wirth_pascal.jpg" width="45" height="45"> <a class="cse" title="Niklaus Wirth"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Niklaus_Wirth">Niklaus Wirth</a> <small>Feb 15, 1934 – Jan 1, 2024</small></div><div info class="an"><b>Niklaus Emil Wirth</b> (born February 15, 1934) is a Swiss computer scientist, best known for designing several programming languages, including Pascal, and for pioneering several classic topics in software engineering. In 1984 he won the Turing Award for developing a sequence of innovative computer languages.<p><a class="wiki" key="Pascal"><b>Pascal</b></a> is an influential imperative and procedural programming language, designed in 1968/9 and published in 1970 by Niklaus Wirth as a small and efficient language intended to encourage good programming practices using structured programming and data structuring.</p></div></flip><flip class="fill-blur" key="smalltalk" style="--blur-size:contain;--blur-amount:16px"><div class="an detail"><div class="logo"><img src="code/logo_PARC.png" height="60"></div><p><a class="wiki" key="Smalltalk"><b>Smalltalk</b></a> is an object-oriented, dynamically typed, reflective programming language. Smalltalk was created as the language to underpin the "new world" of computing exemplified by "human–computer symbiosis." It was designed and created in part for educational use, more so for constructionist learning, at the Learning Research Group (LRG) of Xerox PARC by Alan Kay, Dan Ingalls, Adele Goldberg, Ted Kaehler, Scott Wallace, and others during the 1970s.</p></div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Smalltalk</a> (1970s)</div><a class="cse" title="Xerox PARC"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="PARC_(company)">Xerox PARC</a></div></flip><flip key="prolog" data-src="code/alain_colmerauer.jpg"><div class="subject[rb] dark-bg an" style="width:230px"><div class="lang"><a class="cse">Prolog</a>, 1972</div><img class="avatar" src="code/alain_colmerauer_prolog.jpg" width="45" height="45"> <a class="cse" title="Alain Colmerauer"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Alain_Colmerauer">Alain Colmerauer</a> <small>Jan 24, 1941 – May 12, 2017</small></div><div info class="an"><p><a class="wiki" key="Prolog"><b>Prolog</b></a> is a general purpose logic programming language associated with artificial intelligence and computational linguistics.</p><p>Prolog has its roots in first-order logic, a formal logic, and unlike many other programming languages, Prolog is declarative: the program logic is expressed in terms of relations, represented as facts and rules. A computation is initiated by running a query over these relations.</p></div></flip><flip key="ml" data-src="code/robin_milner.jpg"><div class="subject[rb] dark-bg an" style="width:230px"><div class="lang"><a class="cse" title="ML language">ML</a>, 1972</div><img class="avatar" src="code/robin_milner_ml.jpg" width="45" height="45"> <a class="cse" title="Robin_Milner"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Robin_Milner">Robin_Milner</a> <small>Jan 13, 1934 – Mar 20, 2010</small></div><div info class="an"><p><b>Arthur John Robin Gorell Milner</b> FRS FRSE (Robin Milner or A.J.R.G. Milner, born 13 January 1934 near Plymouth, died 20 March 2010 in Cambridge) was a prominent British computer scientist.</p><p><a class="wiki" key="ML_(programming_language)"><b>ML</b></a> is a general-purpose functional programming language developed by Robin Milner and others in the early 1970s at the University of Edinburgh, whose syntax is inspired by ISWIM. Historically, ML stands for metalanguage: it was conceived to develop proof tactics in the LCF theorem prover (whose language, pplambda, a combination of the first-order predicate calculus and the simply typed polymorphic lambda calculus, had ML as its metalanguage). It is known for its use of the Hindley–Milner type inference algorithm, which can automatically infer the types of most expressions without requiring explicit type annotations.</p></div></flip><flip key="ada" data-src="code/jean_ichbiah.jpg"><div class="subject[rb] dark-bg an" style="width:240px"><div class="lang"><a class="cse" title="Ada language">Ada</a>, 1977</div><img class="avatar" src="code/jean_ichbiah_ada.jpg" width="45" height="45"> <a class="cse" title="Jean Ichbiah"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Jean_Ichbiah">Jean Ichbiah</a> <small>Mar 25, 1940 – Jan 26, 2007</small></div><div info class="an"><p><a class="wiki" key="Ada_(programming_language)"><b>Ada</b></a> is a structured, statically typed, imperative, wide-spectrum, and object-oriented high-level computer programming language, extended from Pascal and other languages.</p><p>Ada was originally designed by a team led by Jean Ichbiah of CII Honeywell Bull under contract to the United States Department of Defense (DoD) from 1977 to 1983 to supersede the hundreds of programming languages then used by the DoD.</p></div></flip><flip class="fill-blur" key="sql" style="--blur-size:contain;--blur-amount:16px"><div class="detail"><div class="logo"><img src="code/logo_IBM.svg" height="60"></div><div class="flex who"><img src="code/donald_chamberlin.jpg"><img src="code/raymond_f_boyce.jpg"></div></div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">SQL</a>, 1970s</div><div><img class="avatar" src="code/donald_chamberlin_sql.jpg" width="45" height="45"> <a class="cse" title="Donald D. Chamberlin"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Donald_D._Chamberlin">Donald D. Chamberlin</a> <small>born December 21, 1944</small></div><div style="clear:both;margin-top:.25rem"><img class="avatar" src="code/raymond_f_boyce_sql.jpg" width="45" height="45"> <a class="cse" title="Raymond F. Boyce"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Raymond_F._Boyce">Raymond F. Boyce</a> <small>Aug 27, 1946 – Jun 18, 1974</small></div></div><div info class="an"><p><a class="wiki" key="SQL"><b>SQL</b></a> (officially /<span class="IPA">ˈɛs kjuː ˈɛl</span>/, often /<span class="IPA">ˌsiːkwəl</span>/; often referred to as Structured Query Language) is a programming language designed for managing data in relational database management systems (RDBMS).</p><p>SQL was developed at IBM by <a class="wiki" key="Donald_D._Chamberlin">Donald D. Chamberlin</a> and <a class="wiki" key="Raymond_F._Boyce">Raymond F. Boyce</a> in the early 1970s. This version, initially called SEQUEL (Structured English Query Language), was designed to manipulate and retrieve data stored in IBM's original quasi-relational database management system, System R, which a group at IBM San Jose Research Laboratory had developed during the 1970s. The acronym SEQUEL was later changed to SQL because "SEQUEL" was a trademark of the UK-based Hawker Siddeley aircraft company.</p></div></flip><flip key="cpp" data-src="code/bjarne_stroustrup.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">C++</a>, 1979</div><img class="avatar" src="code/bjarne_cpp.jpg" width="45" height="45"> <a class="cse" title="Bjarne Stroustrup"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Bjarne_Stroustrup">Bjarne Stroustrup</a> <small>born December 30, 1950</small></div><div info class="an">(Danish pronunciation: [<span class="IPA">ˈbjɑːnə ˈsdʁʌʊ̯ˀsdʁɔb</span>]); born December 30, 1950 in Århus, Denmark) is a Danish computer scientist, most notable for the creation and the development of the widely used C++ programming language.<p><a class="wiki" key="C%2B%2B"><b>C++</b></a> (pronounced "cee plus plus") is a statically typed, free-form, multi-paradigm, compiled, general-purpose programming language. It is regarded as an intermediate-level language, as it comprises a combination of both high-level and low-level language features. It was developed by Bjarne Stroustrup starting in 1979 at Bell Labs as an enhancement to the C language. Originally named C with Classes, the language was later renamed C++ in 1983.</p></div></flip><flip key="objective-c" data-src="code/brad_cox.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Objective-C</a>, 1980s</div><img class="avatar" src="code/brad_cox_objectc.jpg" width="45" height="45"> <a class="cse" title="Brad Cox"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Brad_Cox">Brad Cox</a> <small>May 2, 1944 – Jan 2, 2021</small></div><div info class="an"><b>Brad Cox</b> is a computer scientist and Ph.D. of mathematical biology known mostly for his work in software engineering (specifically software reuse), software componentry, and the Objective-C programming language.<p><a class="wiki" key="Object-C">Objective-C</a> is a reflective, object-oriented programming language that adds Smalltalk-style messaging to the C programming language. It was created primarily by <b>Brad Cox</b> and <b>Tom Love</b> in the early 1980s at their company Stepstone. Both had been introduced to Smalltalk while at ITT Corporation's Programming Technology Center in 1981.</p></div></flip><flip key="erlang" data-src="code/joe_armstrong.jpg"><div class="subject[rb] dark-bg an" style="width:230px"><div class="lang"><a class="cse">Erlang</a>, 1986</div><img class="avatar" src="code/joe_armstrong_erlang.jpg" width="45" height="45"> <a class="cse" title="Joe Armstrong Erlang"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Joe_Armstrong_(programmer)">Joe Armstrong</a> <small>Dec 27, 1950 – Apr 20, 2019</small></div><div info class="an"><a class="wiki" key="Erlang_(programming_language)"><b>Erlang</b></a> (/ˈɜːrlæŋ/ UR-lang) is a general-purpose, concurrent, functional high-level programming language, and a garbage-collected runtime system. The term Erlang is used interchangeably with Erlang/OTP, or Open Telecom Platform (OTP), which consists of the Erlang runtime system, several ready-to-use components (OTP) mainly written in Erlang, and a set of design principles for Erlang programs.</div></flip><flip key="perl" data-src="code/larry_wall.jpg"><div class="subject[rb] dark-bg an" style="width:230px"><div class="lang"><a class="cse">Perl</a>, 1987</div><img class="avatar" src="code/larry_wall_perl.jpg" width="45" height="45"> <a class="cse" title="Larry Wall"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Larry_Wall">Larry Wall</a> <small>born September 27, 1954</small></div><div info class="an"><b>Larry Wall</b> (born September 27, 1954) is a programmer and author, most widely known for his creation of the Perl programming language in 1987.<p><a class="wiki" key="Perl"><b>Perl</b></a> is a high-level, general-purpose, interpreted, dynamic programming language. Perl was originally developed by Larry Wall in 1987 as a general-purpose Unix scripting language to make report processing easier.</p></div></flip><flip key="python" data-src="code/guido_van_rossum.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="Python language">Python</a>, 1989</div><img class="avatar" src="code/guido_van_rossum_python.jpg" width="45" height="45"> <a class="cse" title="Guido van Rossum"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Guido_van_Rossum">Guido van Rossum</a> <small>born January 31, 1956</small></div><div info class="an"><b>Guido van Rossum</b> (born 31 January 1956[citation needed]) is a Dutch computer programmer who is best known as the author of the Python programming language. In the Python community, Van Rossum is known as a "Benevolent Dictator For Life" (BDFL), meaning that he continues to oversee the Python development process, making decisions where necessary.<p><a class="wiki" key="Python_(programming_language)"><b>Python</b></a> is a general-purpose, high-level programming language whose design philosophy emphasizes code readability. Python claims to "[combine] remarkable power with very clear syntax", and its standard library is large and comprehensive. Its use of indentation for block delimiters is unique among popular programming languages.</p></div></flip><flip key="ruby" data-src="code/yukihiro_matsumoto.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="Ruby language">Ruby</a>, 1993</div><img class="avatar" src="code/yukihiro_matsumoto_ruby.jpg" width="45" height="45"> <a class="cse" title="Yukihiro Matsumoto"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Yukihiro_Matsumoto">Yukihiro Matsumoto</a> <small>born April 14, 1965</small></div><div info class="an"><b>Yukihiro Matsumoto</b> (まつもとゆきひろ Matsumoto Yukihiro?, a.k.a. Matz, born 14 April 1965) is a Japanese computer scientist and software programmer best known as the chief designer of the Ruby programming language and its reference implementation, Matz's Ruby Interpreter (MRI).<p><a class="wiki" key="Ruby_(programming_language)">Ruby</a> is a dynamic, reflective, general-purpose object-oriented programming language that combines syntax inspired by Perl with Smalltalk-like features. Ruby originated in Japan during the mid-1990s and was first developed and designed by Yukihiro "Matz" Matsumoto. It was influenced primarily by Perl, Smalltalk, Eiffel, and Lisp.</p></div></flip><flip class="fill-blur" key="lua"><img class="contain" src="code/lua_team.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="Lua language">Lua</a>, 1993</div><img class="avatar" src="code/roberto_ierusalimschy_lua.jpg" width="45" height="45"> <a class="cse" title="Roberto Ierusalimschy"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Roberto_Ierusalimschy">Roberto Ierusalimschy</a> <small>born May 21, 1960</small></div><div info class="an"><b>Roberto Ierusalimschy</b> is an associate professor of informatics at PUC-Rio (Pontifical University in Rio de Janeiro). He is the leading architect of the Lua programming language.<p><a class="wiki" key="Lua_(programming_language)"><b>Lua</b></a> ( /<span class="IPA">ˈluːə</span>/ loo-ə; from Portuguese: lua meaning "moon") is a lightweight multi-paradigm programming language designed as a scripting language with extensible semantics as a primary goal. Lua has a relatively simple C API compared to other scripting languages.</p></div></flip><flip key="php" data-src="code/rasmus_lerdorf.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">PHP</a>, 1994</div><img class="avatar" src="code/rasmus_lerdorf_php.jpg" width="45" height="45"> <a class="cse" title="Rasmus Lerdorf"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Rasmus_Lerdorf">Rasmus Lerdorf</a> <small>born November 22, 1968</small></div><div info class="an"><b>Guido van Rossum</b> (born 31 January 1956[citation needed]) is a Dutch computer programmer who is best known as the author of the Python programming language. In the Python community, Van Rossum is known as a "Benevolent Dictator For Life" (BDFL), meaning that he continues to oversee the Python development process, making decisions where necessary.<p><a class="wiki" key="PHP"><b>PHP</b></a> is a general-purpose server-side scripting language originally designed for web development to produce dynamic web pages. For this purpose, PHP code is embedded into the HTML source document and interpreted by a web server with a PHP processor module, which generates the web page document.</p></div></flip><flip key="java" data-src="code/james_gosling.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Java</a>, 1995</div><img class="avatar" src="code/james_gosling_java.jpg" width="45" height="45"> <a class="cse" title="James Gosling"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="James_Gosling">James Gosling</a> <small>born May 19, 1955</small></div><div info class="an"><b>James A. Gosling</b>, OC (born May 19, 1955 near Calgary, Alberta, Canada) is a software developer, best known as the father of the Java programming language.<p><a class="wiki" key="Java_(programming_language)"><b>Java</b></a> is a programming language originally developed by James Gosling at Sun Microsystems (which is now a subsidiary of Oracle Corporation) and released in 1995 as a core component of Sun Microsystems' Java platform. The language derives much of its syntax from C and C++ but has a simpler object model and fewer low-level facilities. Java applications are typically compiled to bytecode (class file) that can run on any Java Virtual Machine (JVM) regardless of computer architecture. Java is a general-purpose, concurrent, class-based, object-oriented language that is specifically designed to have as few implementation dependencies as possible. It is intended to let application developers "write once, run anywhere."</p></div></flip><flip key="javascript" data-src="code/brendan_eich.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Javascript</a>, 1995</div><img class="avatar" src="code/brendan_eich_javascript.jpg" width="45" height="45"> <a class="cse" title="Brendan Eich"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Brendan_Eich">Brendan Eich</a> <small>born July 4, 1961</small></div><div info class="an">Brendan Eich ( /<span class="IPA">ˈaɪk</span>/; born 1961) is a computer programmer and creator of the JavaScript scripting language.<p><a class="wiki" key="JavaScript"><b>JavaScript</b></a> is a prototype-based scripting language that is dynamic, weakly typed and has first-class functions. It is a multi-paradigm language, supporting object-oriented, imperative, and functional programming styles.</p><p>JavaScript was formalized in the ECMAScript language standard and is primarily used in the form of client-side JavaScript, implemented as part of a Web browser in order to provide enhanced user interfaces and dynamic websites. This enables programmatic access to computational objects within a host environment.</p></div></flip><flip key="c-sharp" data-src="code/anders_hejlsberg.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">C#</a>, 2000</div><img class="avatar" src="code/anders_hejlsberg_csharp.jpg" width="45" height="45"> <a class="cse" title="Anders Hejlsberg"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Anders_Hejlsberg">Anders Hejlsberg</a> <small>born December 2, 1960</small>t</div><div info class="an">During the development of the .NET Framework, the class libraries were originally written using a managed code compiler system called Simple Managed C (SMC). In January 1999, Anders Hejlsberg formed a team to build a new language at the time called Cool, which stood for "C-like Object Oriented Language".[16] Microsoft had considered keeping the name "Cool" as the final name of the language, but chose not to do so for trademark reasons. By the time the .NET project was publicly announced at the July 2000 Professional Developers Conference, the language had been renamed C#, and the class libraries and ASP.NET runtime had been ported to C#.</div></flip><flip key="d" data-src="code/walter_bright.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="D language">D</a>, 2001</div><img class="avatar" src="code/walter_bright_d.jpg" width="45" height="45"> <a class="cse" title="Walter Bright"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Walter_Bright">Walter Bright</a> <small>born March 10, 1959</small></div><div info class="an">D is a general-purpose systems programming language with a C-like syntax that compiles to native code. It is statically typed and supports both automatic (garbage collected) and manual memory management. D programs are structured as modules that can be compiled separately and linked with external libraries to create native libraries or executables.</div></flip><flip key="scala" data-src="code/martin_odersky.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Scala</a>, 2003</div><img class="avatar" src="code/martin_odersky_scala.jpg" width="45" height="45"> <a class="cse" title="Martin Odersky"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Martin_Odersky">Martin Odersky</a> <small>born September 5, 1958</small></div><div info class="an">Scala (/ˈskɑːlɑː/ SKAH-lah) is a strong statically typed high-level general-purpose programming language that supports both object-oriented programming and functional programming. Designed to be concise, many of Scala's design decisions are intended to address criticisms of Java.</div></flip><flip class="fill-blur" key="go"><div class="detail"><div class="flex who"><img src="code/robert_griesemer.jpg"><img src="code/rob_pike.jpg"><img src="code/ken_thompson.jpg"></div></div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="Go language">Go</a>, 2009</div><div><img class="avatar" src="code/robert_griesemer_go.jpg" width="45" height="45"> <a class="cse" title="Robert Griesemer"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Robert Griesemer</a> <small>born 1964</small></div><div style="clear:both;margin-top:.25rem"><img class="avatar" src="code/rob_pike_go.jpg" width="45" height="45"> <a class="cse" title="Rob Pike"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Rob Pike</a> <small>born 1956</small></div><div style="clear:both;margin-top:.25rem"><img class="avatar" src="code/ken_thompson_go.jpg" width="45" height="45"> <a class="cse" title="Ken Thompson"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Ken Thompson</a> <small>born February 4, 1943</small></div></div><div info class="an"><a class="wiki" key="Go_(programming_language)"><b>Go</b></a> is a high-level general purpose programming language that is statically typed and compiled. It is known for the simplicity of its syntax and the efficiency of development that it enables by the inclusion of a large standard library supplying many needs for common projects. It was designed at Google in 2009 by Robert Griesemer, Rob Pike, and Ken Thompson. It is syntactically similar to C, but also has memory safety, garbage collection, structural typing, and CSP-style concurrency. It is often referred to as Golang to avoid ambiguity and because of its former domain name, golang.org, but its proper name is Go.</div></flip><flip key="rust" data-src="code/graydon_hoare.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Rust</a>, 2006</div><img class="avatar" src="code/graydon_hoare_rust.jpg" width="45" height="45"> <a class="cse" title="Graydon Hoare"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Graydon Hoare</a> <small>born in Canada</small></div><div info class="an"><a class="wiki" key="Rust language"><b>Rust</b></a> is a general-purpose programming language emphasizing performance, type safety, and concurrency. It enforces memory safety, meaning that all references point to valid memory. It does so without a conventional garbage collector; instead, memory safety errors and data races are prevented by the "borrow checker", which tracks the object lifetime of references at compile time.</div></flip><flip class="fill-blur" key="dart"><div class="an detail"><div class="flex who"><img src="code/lars_bak.jpg"><img src="code/kasper_lund.jpg"></div></div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="Dart language">Dart</a>, 2011</div><div><img class="avatar" src="code/lars_bak_dart.jpg" width="45" height="45"> <a class="cse" title="Lars Bak Dart"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Lars_Bak_(computer_programmer)">Lars Bak</a> <small>born 1965</small></div><div style="clear:both;margin-top:.25rem"><img class="avatar" src="code/kasper_lund_dart.jpg" width="45" height="45"> <a class="cse" title="Kasper Lund Dart"><svg width="12" height="12"><use href="#search"></use></svg></a><a href="https://www.crunchbase.com/person/kasper-lund" target="_blank">Kasper Lund</a> <small>...</small></div></div><div info class="an"><a class="wiki" key="Dart_(programming_language)">Dart</a> is a programming language designed by Lars Bak and Kasper Lund and developed by Google. It can be used to develop web and mobile apps as well as server and desktop applications.<p>Dart is an object-oriented, class-based, garbage-collected language with C-style syntax. It can compile to machine code, JavaScript, or WebAssembly. It supports interfaces, mixins, abstract classes, reified generics and type inference.</p></div></flip><flip key="kotlin" data-src="code/andrey_breslav.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Kotlin</a>, 2011</div><img class="avatar" src="code/andrey_breslav_kotlin.jpg" width="45" height="45"> <a class="cse" title="Andrey Breslav"><svg width="12" height="12"><use href="#search"></use></svg></a><a href="https://www.abreslav.com/bio" target="_blank">Andrey Breslav</a> <small>born 1984</small></div><div info class="an"><a class="wiki" key="Kotlin_(programming_language)">Kotlin</a> (/ˈkɒtlɪn/) is a cross-platform, statically typed, general-purpose high-level programming language with type inference. Kotlin is designed to interoperate fully with Java, and the JVM version of Kotlin's standard library depends on the Java Class Library, but type inference allows its syntax to be more concise. Kotlin mainly targets the JVM, but also compiles to JavaScript (e.g., for frontend web applications using React) or native code via LLVM (e.g., for native iOS apps sharing business logic with Android apps). Language development costs are borne by JetBrains, while the Kotlin Foundation protects the Kotlin trademark.</div></flip><flip key="elixir" data-src="code/jose_valim.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="Elixir language">Elixir</a>, 2012</div><img class="avatar" src="code/jose_valim_elixir.jpg" width="45" height="45"> <a class="cse" title="José Valim Elixir"><svg width="12" height="12"><use href="#search"></use></svg></a>José Valim <small>born in Porto Alegre</small></div><div info class="an"><a class="wiki" key="Elixir_(programming_language)">Elixir</a> is a dynamic, functional language for building scalable and maintainable applications.<p>Elixir runs on the Erlang VM, known for creating low-latency, distributed, and fault-tolerant systems. These capabilities and Elixir tooling allow developers to be productive in several domains, such as web development, embedded software, machine learning, data pipelines, and multimedia processing, across a wide range of industries.</p></div></flip><flip key="typescript" data-src="code/anders_hejlsberg.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">TypeScript</a>, 2012</div><img class="avatar" src="code/anders_hejlsberg_csharp.jpg" width="45" height="45"> <a class="cse" title="Anders Hejlsberg"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki" key="Anders_Hejlsberg">Anders Hejlsberg</a> <small>born December 2, 1960</small></div><div info class="an"><a class="wiki"><b>TypeScript</b></a> (abbreviated as TS) is a free and open-source high-level programming language developed by Microsoft that adds static typing with optional type annotations to JavaScript. It is designed for the development of large applications and transpiles to JavaScript.</div></flip><flip class="fill-blur" key="julia"><img class="contain" src="code/julia_team.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="Julia language">Julia</a>, 2012</div><div><img class="avatar" src="code/jeff_bezanson_julia.jpg" width="45" height="45"> <a class="cse" title="Jeff Bezanson"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Jeff Bezanson</a> <small>born Dec 26, 1981</small></div><div style="clear:both;margin-top:.25rem"><img class="avatar" src="code/stefan_karpinski_julia.jpg" width="45" height="45"> <a class="cse" title="Stefan Karpinski"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Stefan Karpinski</a> <small></small></div><div style="clear:both;margin-top:.25rem"><img class="avatar" src="code/viral_b_shah_julia.jpg" width="45" height="45"> <a class="cse" title="Viral B. Sha"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Viral B. Shah</a> <small></small></div><div style="clear:both;margin-top:.25rem"><img class="avatar" src="code/alan_edelman_julia.jpg" width="45" height="45"> <a class="cse" title="Alan Edelman"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Alan Edelman</a> <small>born 1963</small></div></div>s<div info class="an"><a class="wiki" key="Julia_(programming_language)"><b>Julia</b></a> is a high-level, general-purpose dynamic programming language, designed to be fast and productive, for e.g. data science, artificial intelligence, machine learning, modeling and simulation, most commonly used for numerical analysis and computational science.</div></flip><flip key="swift" data-src="code/chris_lattner.jpg"><div class="an detail"></div><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="Swift language">Swift</a>, 2014</div><img class="avatar" src="code/chris_lattner_swift.jpg" width="45" height="45"> <a class="cse" title="Chris Lattner"><svg width="12" height="12"><use href="#search"></use></svg></a><a class="wiki">Chris Lattner</a> <small>born 1978</small></div><div info class="an"><a class="wiki" key="Swift_(programming_language)"><b>Swift</b></a> is a high-level general-purpose, multi-paradigm, compiled programming language created by Chris Lattner in 2010 for Apple Inc. and maintained by the open-source community. Swift compiles to machine code and uses an LLVM-based compiler. Swift was first released in June 2014 and the Swift toolchain has shipped in Xcode since Xcode version 6, released in September 2014.</div></flip><flip key="zig" data-src="code/andrew_kelley.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse">Zig</a>, 2015</div><img class="avatar" src="code/andrew_kelley_zig.jpg" width="45" height="45"> <a class="cse" title="Andrew Kelley zig language"><svg width="12" height="12"><use href="#search"></use></svg></a><a href="https://andrewkelley.me/" target="_blank">Andrew Kelley</a> <small>…</small></div><div info class="an"><a class="wiki" key="Zig_(programming_language)"><b>Zig</b></a> is an imperative, general-purpose, statically typed, compiled system programming language designed by Andrew Kelley. It is free and open-source software, released under an MIT License.</div></flip><flip key="v" data-src="code/alexander_medvednikov.jpg"><div class="subject[rb] dark-bg an"><div class="lang"><a class="cse" title="V language">V lang</a>, 2019</div><img class="avatar" src="code/alexander_medvednikov_v.jpg" width="45" height="45"> <a class="cse" title="Alexander Medvednikov V language"><svg width="12" height="12"><use href="#search"></use></svg></a><a href="https://github.com/medvednikov" target="_blank">Alexander Medvednikov</a> <small>…</small></div><div info class="an"><a class="wiki" key="V_(programming_language)"><b>V</b></a>, also known as vlang, is a statically typed, compiled programming language created by Alexander Medvednikov in early 2019. It was inspired by the language Go, and other influences including Oberon, Swift, and Rust. It is free and open-source software released under the MIT License, and currently in beta.<p>The goals of V include ease of use, readability, and maintainability.</p></div></flip></template></atm-flip></div></body></html>
